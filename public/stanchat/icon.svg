<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#26121B"/>
      <stop offset="55%" stop-color="#0C0A10"/>
      <stop offset="100%" stop-color="#050509"/>
    </radialGradient>
    <radialGradient id="orb" cx="42%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#FF7B92"/>
      <stop offset="44%" stop-color="#FF3B5C"/>
      <stop offset="100%" stop-color="#D81E42"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3B5C" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#FF3B5C" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FF3B5C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- Soft brand halo -->
  <circle cx="256" cy="244" r="196" fill="url(#halo)"/>
  <!-- Aura ring -->
  <circle cx="256" cy="244" r="150" fill="none" stroke="#FF3B5C" stroke-width="9" opacity="0.55"/>

  <!-- Stan — a chat-orb mascot with a speech-bubble tail. -->
  <path d="M170 352 q-8 40 -36 58 q46 4 76 -28 z" fill="url(#orb)" opacity="0.95"/>
  <circle cx="256" cy="244" r="118" fill="url(#orb)"/>
  <!-- Top sheen -->
  <ellipse cx="214" cy="196" rx="40" ry="28" fill="#FFFFFF" opacity="0.30"/>

  <!-- Face -->
  <circle cx="218" cy="236" r="24" fill="#FFFFFF"/>
  <circle cx="294" cy="236" r="24" fill="#FFFFFF"/>
  <circle cx="224" cy="241" r="11" fill="#1A0710"/>
  <circle cx="300" cy="241" r="11" fill="#1A0710"/>
  <path d="M214 288 q42 42 84 0" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" opacity="0.92"/>
</svg>
