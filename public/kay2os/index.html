<style>
  /* ============================================================
     MacPiOs — macOS-style desktop shell for KAY2Tunnel
     Authentic Apple design language: SF stack, vibrancy, squircles
     ============================================================ */
  :root{
    --sf: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace;
    --accent:#2b7fff;            /* macOS blue */
    --clive:#2BE5FF;             /* on-brand cyan tie-in */
    --radius-win:12px;
    --menubar-h:28px;
    --dock-base:52px;
    --ease:cubic-bezier(.22,.61,.36,1);
    /* iOS safe-area insets (Dynamic Island / notch / home indicator). 0 on desktop. */
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
    --safe-left:env(safe-area-inset-left, 0px);
    --safe-right:env(safe-area-inset-right, 0px);
  }
  html[data-theme="dark"]{
    --bg-text:#f5f5f7; --bg-text-dim:#a1a1a6;
    --win-bg:rgba(40,40,44,.78);
    --win-bg-solid:#2a2a2e;
    --win-border:rgba(255,255,255,.12);
    --titlebar:rgba(54,54,58,.72);
    --bar:rgba(28,28,32,.55);
    --menu-pop:rgba(46,46,52,.78);
    --sidebar:rgba(255,255,255,.04);
    --hairline:rgba(255,255,255,.09);
    --field:rgba(255,255,255,.08);
    --shadow:0 22px 70px rgba(0,0,0,.55), 0 4px 14px rgba(0,0,0,.4);
  }
  html[data-theme="light"]{
    --bg-text:#1d1d1f; --bg-text-dim:#6e6e73;
    --win-bg:rgba(246,246,248,.82);
    --win-bg-solid:#f4f4f6;
    --win-border:rgba(0,0,0,.08);
    --titlebar:rgba(236,236,240,.78);
    --bar:rgba(255,255,255,.5);
    --menu-pop:rgba(250,250,252,.82);
    --sidebar:rgba(0,0,0,.025);
    --hairline:rgba(0,0,0,.08);
    --field:rgba(0,0,0,.05);
    --shadow:0 22px 70px rgba(0,0,0,.28), 0 3px 10px rgba(0,0,0,.16);
  }
  *{box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;}
  html,body{height:100%; margin:0; overflow:hidden; font-family:var(--sf); color:var(--bg-text); overscroll-behavior:none;}
  /* lock the page so iOS treats it like an app (no rubber-band bounce, no page zoom) */
  body{background:#000; position:fixed; inset:0; width:100%; height:100%; touch-action:manipulation;}
  /* on touch devices, reveal hover-only controls (no hover to trigger them) */
  @media (hover:none){
    .files .fr .fr-act{opacity:1;}           /* extra specificity beats the later opacity:0 rule */
    .dock-item:hover .dock-tip{opacity:0;}   /* tooltips are pointless on touch */
  }
  /* iOS "Add to Home Screen" hint (only shown in mobile Safari, not standalone) */
  #a2hs{position:fixed; left:50%; bottom:calc(96px + var(--safe-bottom)); transform:translateX(-50%) translateY(20px);
    z-index:9700; display:flex; align-items:center; gap:12px; width:min(360px,90vw); padding:13px 15px; border-radius:16px;
    background:rgba(28,28,34,.86); backdrop-filter:saturate(180%) blur(26px); -webkit-backdrop-filter:saturate(180%) blur(26px);
    border:.5px solid rgba(255,255,255,.14); box-shadow:0 16px 44px rgba(0,0,0,.5); color:#fff; opacity:0; transition:opacity .3s,transform .3s;}
  #a2hs.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #a2hs .a2-ic{width:40px; height:40px; flex:0 0 auto; border-radius:11px; display:grid; place-items:center; background:linear-gradient(150deg,#2BE5FF,#0a6cff);}
  #a2hs .a2-ic img{width:40px; height:40px; border-radius:11px;}
  #a2hs .a2-tx{flex:1; min-width:0; font-size:13px; line-height:1.4;}
  #a2hs .a2-tx b{display:block; font-size:14px;}
  #a2hs .a2-tx span{color:rgba(255,255,255,.7);}
  #a2hs .a2-share{display:inline-grid; place-items:center; width:17px; height:17px; vertical-align:-3px; color:#2BE5FF;}
  #a2hs .a2-share svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
  #a2hs .a2-x{flex:0 0 auto; width:28px; height:28px; border:none; border-radius:8px; background:rgba(255,255,255,.12); color:#fff; font-size:13px; cursor:pointer;}

  /* ---------- wallpaper ---------- */
  #wallpaper{position:fixed; inset:0; z-index:0; transition:filter .4s;}
  /* Replica of the iOS "silk" wallpaper: violet bloom top-right, magenta mid,
     teal-blue bottom-left, over a deep navy base. The ::before adds soft
     diagonal light streaks for the flowing-silk feel. */
  html[data-theme="dark"] #wallpaper{
    background:
      radial-gradient(700px 520px at 64% 52%, rgba(255,150,120,.42) 0%, transparent 60%),
      radial-gradient(900px 700px at 60% 44%, rgba(255,110,160,.40) 0%, transparent 62%),
      radial-gradient(900px 900px at 78% 6%, rgba(150,88,226,.50) 0%, transparent 60%),
      radial-gradient(1100px 1300px at 106% 38%, rgba(196,60,150,.40) 0%, transparent 55%),
      radial-gradient(1300px 1200px at -6% 104%, rgba(40,60,170,.55) 0%, transparent 55%),
      radial-gradient(700px 700px at 18% 80%, rgba(60,40,150,.40) 0%, transparent 62%),
      linear-gradient(155deg,#2a1c4e 0%, #20184a 34%, #14143a 60%, #0a1030 82%, #070c22 100%);
  }
  /* Photo wallpaper (MacPiOs neon art). Toggle in Settings → Appearance. */
  html.wp-photo #wallpaper{ background:#08010f url("wallpaper.jpg") center/cover no-repeat !important; }
  html.wp-photo #wallpaper::before{ display:none !important; }
  html[data-theme="dark"] #wallpaper::before{
    content:""; position:absolute; inset:-25%; pointer-events:none;
    background:
      linear-gradient(122deg, transparent 39%, rgba(155,212,255,.18) 47%, transparent 54%),
      linear-gradient(126deg, transparent 55%, rgba(212,132,236,.15) 61%, transparent 67%),
      linear-gradient(118deg, transparent 70%, rgba(120,160,255,.10) 75%, transparent 80%);
    filter:blur(26px); transform:rotate(-5deg);
  }
  html[data-theme="light"] #wallpaper{
    background:
      radial-gradient(1100px 800px at 80% 8%, #8fb6ff 0%, transparent 55%),
      radial-gradient(1000px 900px at 8% 92%, #7fe3d6 0%, transparent 55%),
      radial-gradient(900px 700px at 55% 65%, #c7a8ff 0%, transparent 60%),
      linear-gradient(160deg,#dbe6ff 0%, #eaf0ff 60%, #f4f6ff 100%);
  }
  #brightness{position:fixed; inset:0; z-index:9998; background:#000; opacity:0; pointer-events:none; transition:opacity .2s;}

  /* ---------- menu bar ---------- */
  /* Height grows by the top inset so the bar's content sits BELOW the Dynamic
     Island / status bar. box-sizing:border-box keeps the flex content box at
     --menubar-h, so items stay centered in the strip under the island. */
  #menubar{position:fixed; top:0; left:0; right:0; height:calc(var(--menubar-h) + var(--safe-top)); z-index:9000;
    display:flex; align-items:center; gap:2px;
    padding:var(--safe-top) calc(8px + var(--safe-right)) 0 calc(8px + var(--safe-left));
    background:var(--bar); backdrop-filter:saturate(180%) blur(22px); -webkit-backdrop-filter:saturate(180%) blur(22px);
    font-size:13px; font-weight:500;}
  .mb-item{padding:2px 9px; border-radius:6px; cursor:default; line-height:1; white-space:nowrap;}
  .mb-item:hover, .mb-item.open{background:rgba(125,125,135,.32);}
  #mb-apple svg{width:15px; height:15px; display:block; fill:var(--bg-text);}
  #mb-appname{font-weight:700;}
  #mb-right{margin-left:auto; display:flex; align-items:center; gap:1px;}
  #mb-right .mb-item{padding:2px 7px; display:flex; align-items:center;}
  #mb-right svg{width:16px; height:16px; fill:none; stroke:var(--bg-text); stroke-width:1.7;}
  #mb-clock{font-variant-numeric:tabular-nums; font-weight:500;}

  /* dropdown menus */
  .menu-pop{position:fixed; z-index:9500; min-width:200px; padding:5px; border-radius:10px;
    background:var(--menu-pop); backdrop-filter:saturate(180%) blur(28px); -webkit-backdrop-filter:saturate(180%) blur(28px);
    border:.5px solid var(--win-border); box-shadow:var(--shadow); font-size:13.5px; display:none;}
  .menu-pop.show{display:block; animation:pop .12s var(--ease);}
  @keyframes pop{from{opacity:0; transform:translateY(-4px) scale(.98);} to{opacity:1; transform:none;}}
  .menu-row{padding:5px 10px; border-radius:6px; display:flex; justify-content:space-between; gap:24px; cursor:default;}
  .menu-row:hover{background:var(--accent); color:#fff;}
  .menu-row.disabled{opacity:.4;} .menu-row.disabled:hover{background:none; color:inherit;}
  .ctx-pop{min-width:184px;}
  .menu-row.danger{color:#ff6b62;} .menu-row.danger:hover{background:#ff453a; color:#fff;}
  /* touch: tap feedback on dock icons (no hover state on iOS) */
  @media (hover:none){ .dock-item:active .dock-icon{transform:scale(1.32) !important; transition:transform .1s;} }
  .menu-sep{height:.5px; background:var(--hairline); margin:5px 8px;}
  .menu-row .sc{opacity:.55; font-size:12px;}

  /* control center */
  #cc{position:fixed; top:calc(var(--safe-top) + var(--menubar-h) + 6px); right:calc(8px + var(--safe-right)); z-index:9500; width:300px; padding:14px; display:none;
    border-radius:16px; background:var(--menu-pop); backdrop-filter:saturate(180%) blur(28px); -webkit-backdrop-filter:saturate(180%) blur(28px);
    border:.5px solid var(--win-border); box-shadow:var(--shadow);}
  #cc.show{display:block; animation:pop .14s var(--ease);}
  .cc-card{background:var(--field); border-radius:12px; padding:12px; margin-bottom:10px;}
  .cc-row{display:flex; align-items:center; gap:10px; font-size:13px; margin:7px 0;}
  .cc-toggle{margin-left:auto; width:38px; height:22px; border-radius:11px; background:rgba(140,140,150,.5); position:relative; cursor:pointer; transition:background .2s;}
  .cc-toggle.on{background:var(--accent);}
  .cc-toggle::after{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:left .2s var(--ease);}
  .cc-toggle.on::after{left:18px;}
  .cc-slider{flex:1; -webkit-appearance:none; appearance:none; height:6px; border-radius:3px; background:rgba(140,140,150,.4); outline:none;}
  .cc-slider::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.35); cursor:pointer;}
  #cc{width:330px; max-height:calc(100vh - var(--safe-top) - var(--menubar-h) - 24px); overflow:auto;}
  .cc-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
  .cc-tile{background:var(--field); border-radius:14px; padding:11px 12px; display:flex; align-items:center; gap:10px; cursor:pointer; min-height:60px;}
  .cc-tile .ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto; background:rgba(140,140,150,.32); color:var(--bg-text); transition:background .2s,color .2s;}
  .cc-tile .ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;}
  .cc-tile.active .ico{background:var(--accent); color:#fff;}
  .cc-tile.active.bt .ico{background:#2b7fff;} .cc-tile.active.wifi .ico{background:#2b7fff;}
  .cc-tile .tt{font-size:12.5px;font-weight:600;line-height:1.2;}
  .cc-tile .ts{font-size:11px;color:var(--bg-text-dim);}
  .cc-slabel{display:flex;align-items:center;gap:10px;}
  .cc-slabel svg{width:16px;height:16px;opacity:.8;fill:none;stroke:currentColor;stroke-width:1.8;flex:0 0 auto;}
  .cc-pct{margin-left:auto;font-size:12px;color:var(--bg-text-dim);font-variant-numeric:tabular-nums;}
  .cc-title{font-size:12px;font-weight:700;color:var(--bg-text-dim);margin:2px 0 8px;}
  .cc-pi .pr{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:12.5px;}
  .cc-pi .pr .pl{display:flex;align-items:center;gap:9px;}
  .cc-pi .pr .pl svg{width:15px;height:15px;opacity:.85;fill:none;stroke:currentColor;stroke-width:1.8;}
  .cc-pi .pr b{font-variant-numeric:tabular-nums;}
  .cc-edit{width:100%;text-align:center;font-size:12px;color:var(--bg-text-dim);padding:9px;cursor:pointer;border-radius:10px;}
  .cc-edit:hover{background:var(--field);}

  /* ---------- windows ---------- */
  #windows{position:fixed; inset:0; z-index:100; pointer-events:none;}
  .window{position:absolute; pointer-events:auto; min-width:320px; min-height:200px; display:flex; flex-direction:column;
    border-radius:var(--radius-win); overflow:hidden; background:var(--win-bg);
    backdrop-filter:saturate(180%) blur(30px); -webkit-backdrop-filter:saturate(180%) blur(30px);
    border:.5px solid var(--win-border); box-shadow:var(--shadow); transition:opacity .18s, transform .18s var(--ease);}
  .window.appearing{animation:winIn .28s cubic-bezier(.2,.9,.25,1.12);}
  @keyframes winIn{0%{opacity:0; transform:scale(.9) translateY(12px);} 55%{opacity:1;} 100%{opacity:1; transform:none;}}
  /* snap-zone preview while dragging a window to a screen edge/corner */
  #snap-preview{position:fixed; z-index:90; pointer-events:none; border-radius:16px;
    background:rgba(43,229,255,.13); border:1.5px solid rgba(43,229,255,.55); box-shadow:inset 0 0 40px rgba(43,229,255,.22), 0 8px 30px rgba(0,0,0,.3);
    opacity:0; transform:scale(.985); transition:opacity .16s var(--ease), transform .16s var(--ease), left .13s var(--ease), top .13s, width .13s, height .13s;}
  #snap-preview.show{opacity:1; transform:scale(1);}
  @media (prefers-reduced-motion:reduce){ .window.appearing{animation:winIn .12s ease;} #snap-preview{transition:opacity .1s;} }
  /* ⌘/Ctrl-Tab app switcher overlay */
  #appswitch{position:fixed; inset:0; z-index:9600; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .12s;}
  #appswitch.show{opacity:1; pointer-events:auto;}
  #appswitch .as-inner{display:flex; gap:10px; padding:16px 18px; border-radius:24px; max-width:92vw; overflow-x:auto; scrollbar-width:none;
    background:var(--menu-pop,rgba(40,40,46,.82)); backdrop-filter:saturate(180%) blur(34px); -webkit-backdrop-filter:saturate(180%) blur(34px);
    border:.5px solid var(--win-border,rgba(255,255,255,.12)); box-shadow:0 28px 70px rgba(0,0,0,.55); animation:winIn .16s var(--ease);}
  #appswitch .as-inner::-webkit-scrollbar{display:none;}
  .as-item{display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 8px 8px; border-radius:18px; cursor:pointer; width:98px; flex:0 0 auto; transition:background .12s;}
  .as-item.sel{background:rgba(140,150,255,.22);}
  .as-ic{width:58px; height:58px; border-radius:16px; display:grid; place-items:center; color:#fff; box-shadow:0 8px 18px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.25);}
  .as-ic svg{width:30px; height:30px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .as-nm{font-size:12px; color:var(--bg-text); max-width:92px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .titlebar{height:38px; flex:0 0 38px; display:flex; align-items:center; padding:0 12px; gap:8px;
    background:var(--titlebar); border-bottom:.5px solid var(--hairline); cursor:default;}
  .lights{display:flex; gap:8px;}
  .light{width:12px; height:12px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:9px; color:rgba(0,0,0,.55); font-weight:700;}
  .light svg{width:7px; height:7px; opacity:0; stroke:rgba(0,0,0,.6); stroke-width:1.6; fill:none; stroke-linecap:round;}
  .lights:hover .light svg{opacity:1;}
  .l-close{background:#ff5f57;} .l-min{background:#febc2e;} .l-max{background:#28c840;}
  .window:not(.focused) .light{background:#c4c4c8;}
  .titlebar .wt{flex:1; text-align:center; font-size:13px; font-weight:600; color:var(--bg-text); margin-right:52px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .win-body{flex:1; overflow:hidden; position:relative; background:transparent;}
  .window.opaque .win-body{background:var(--win-bg-solid);}
  /* Touch devices: no hover, so always show the traffic-light glyphs and give
     them an iOS-sized tap target — otherwise the close ("back") button is a
     tiny 12px dot that's easy to miss, especially when maximized. */
  @media (pointer:coarse){
    .titlebar{height:46px; flex-basis:46px; padding:0 14px; gap:12px;}
    .light{width:16px; height:16px;}
    .lights{gap:12px;}
    .light svg{opacity:1; width:9px; height:9px;}
    .titlebar .wt{margin-right:64px;}
  }
  /* resize handles */
  .rz{position:absolute; z-index:5;}
  .rz-n{top:-3px;left:8px;right:8px;height:7px;cursor:ns-resize;}
  .rz-s{bottom:-3px;left:8px;right:8px;height:7px;cursor:ns-resize;}
  .rz-e{right:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize;}
  .rz-w{left:-3px;top:8px;bottom:8px;width:7px;cursor:ew-resize;}
  .rz-ne{top:-4px;right:-4px;width:14px;height:14px;cursor:nesw-resize;}
  .rz-nw{top:-4px;left:-4px;width:14px;height:14px;cursor:nwse-resize;}

  /* ---------- dock ---------- */

    border-radius:22px; background:var(--bar); backdrop-filter:saturate(180%) blur(26px); -webkit-backdrop-filter:saturate(180%) blur(26px);
    border:.5px solid var(--win-border); box-shadow:0 12px 40px rgba(0,0,0,.45);}
  .dock-item{position:relative; display:flex; flex-direction:column; align-items:center; cursor:pointer;
    width:var(--dock-base); transition:width .18s var(--ease);}
  .dock-icon{position:relative; width:var(--dock-base); height:var(--dock-base); border-radius:23%; transform-origin:50% 100%;
    transition:transform .18s var(--ease); box-shadow:0 5px 13px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.32), inset 0 0 0 .5px rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .dock-icon::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.06) 40%, rgba(0,0,0,.04) 70%, rgba(0,0,0,.12) 100%);}
  .dock-icon{box-shadow:0 6px 15px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.42), inset 0 -8px 14px rgba(0,0,0,.16), inset 0 0 0 .5px rgba(255,255,255,.14);}
  .dock-icon svg{width:60%; height:60%; position:relative; z-index:1; stroke-width:2.1; filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.32));}
  .dock-item .runningdot{position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--bg-text); opacity:0; transition:opacity .2s;}
  .dock-item.running .runningdot{opacity:.85;}
  .dock-item.agent-live .runningdot{opacity:.85; background:#32d74b;}
  .agsw{position:fixed; z-index:4000; min-width:236px; padding:6px; border-radius:14px;
    background:var(--glass,rgba(40,40,46,.86)); backdrop-filter:blur(26px) saturate(180%); -webkit-backdrop-filter:blur(26px) saturate(180%);
    border:1px solid rgba(255,255,255,.12); box-shadow:0 18px 50px rgba(0,0,0,.5); font:13px var(--sf,system-ui); color:#fff;}
  .agsw .agsw-h{font-size:11px; opacity:.55; padding:5px 9px 6px; text-transform:uppercase; letter-spacing:.4px;}
  .agsw-row{display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:9px; cursor:pointer;}
  .agsw-row:hover{background:rgba(125,125,135,.32);}
  .agsw-row .ic{width:24px; height:24px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:#fff; flex:0 0 auto;}
  .agsw-row .ic svg{width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.7;}
  .agsw-row .nm{flex:1; white-space:nowrap;}
  .agsw-row .sc{opacity:.45; font-size:11px;}
  .agsw-dot{width:8px; height:8px; border-radius:50%; background:#6b6b70; flex:0 0 auto;}
  .agsw-dot.live{background:#32d74b; box-shadow:0 0 6px rgba(50,215,75,.8);}
  .agsw-row.missing{opacity:.45;}
  .dock-item.bouncing .dock-icon{animation:bounce .55s var(--ease) 2;}
  @keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-26px);}}
  .dock-tip{position:absolute; bottom:calc(var(--dock-base) + 22px); padding:4px 9px; border-radius:7px; font-size:12px; font-weight:500;
    background:var(--menu-pop); border:.5px solid var(--win-border); box-shadow:var(--shadow); white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s; color:var(--bg-text);}

  .dock-sep{width:1px; align-self:stretch; margin:6px 4px; background:var(--hairline);}

  /* ---------- spotlight ---------- */

  /* dashboard */
  .wl-top{display:flex; justify-content:center; margin-bottom:6px;}
  .wl-acct{display:inline-flex; align-items:center; gap:8px; border:none; background:var(--field); color:var(--bg-text); border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; max-width:100%;}
  .wl-acct b{font-weight:600;} .wl-addr{color:var(--bg-text-dim); font-family:var(--mono,ui-monospace,Menlo,monospace); font-size:11.5px;} .wl-caret{color:var(--bg-text-dim); font-size:10px;}
  .wl-dot{width:8px; height:8px; border-radius:50%; background:#6b6b70; flex:0 0 auto;} .wl-dot.on{background:#32d74b; box-shadow:0 0 6px rgba(50,215,75,.7);}
  .wl-hero{text-align:center; padding:14px 0 18px;}
  .wl-fiat{font-size:40px; font-weight:300; line-height:1.05;} .wl-tonbig{font-size:14px; color:var(--bg-text-dim); margin-top:4px;}
  .wl-actions{display:flex; gap:10px; justify-content:center; margin-bottom:8px;}
  .wl-act{flex:1; max-width:84px; border:none; background:transparent; color:var(--bg-text); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; font-weight:600;}
  .wl-act .wl-ai{width:48px; height:48px; border-radius:50%; display:grid; place-items:center; font-size:20px; background:rgba(0,152,234,.16); color:#0098ea; transition:filter .15s,transform .1s;}
  .wl-act:hover .wl-ai{filter:brightness(1.15);} .wl-act:active .wl-ai{transform:scale(.92);}
  .wl-act.off{opacity:.45;} .wl-act.off .wl-ai{background:var(--field); color:var(--bg-text-dim);}
  .walletapp .ton-tabs{display:flex; gap:2px; padding:2px; background:var(--field); border-radius:9px; margin:10px 0 6px;}
  .walletapp .ton-tabs button{flex:1;}
  /* sheets */
  .wl-sheet{position:absolute; inset:0; z-index:14; display:flex; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.4); opacity:0; transition:opacity .22s;}
  .wl-sheet.show{opacity:1;} .wl-sheet-card{width:100%; max-height:92%; overflow:auto; background:var(--win-bg-solid,#15151c); border-radius:20px 20px 0 0; padding:14px 16px 20px; transform:translateY(100%); transition:transform .26s var(--ease); box-shadow:0 -10px 40px rgba(0,0,0,.4);}
  .wl-sheet.show .wl-sheet-card{transform:none;}
  .wl-sheet-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;} .wl-sheet-h b{font-size:16px;}
  .wl-sheet-x{border:none; background:var(--field); color:var(--bg-text); width:28px; height:28px; border-radius:9px; cursor:pointer;}
  .wl-l{display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--bg-text-dim); margin:12px 0 5px;}
  .wl-in{width:100%; border:none; outline:none; background:var(--field); color:var(--bg-text); border-radius:11px; padding:12px 13px; font:14px var(--sf,system-ui);}
  .wl-amt{display:flex; align-items:center; gap:8px; background:var(--field); border-radius:11px; padding:0 10px 0 0;} .wl-amt .wl-in{background:transparent; flex:1;}
  .wl-amt-c{color:var(--bg-text-dim); font-weight:600; font-size:13px;} .wl-max{border:none; background:rgba(0,152,234,.2); color:#0098ea; font-weight:700; border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer;}
  .wl-fiat-sm{font-size:12px; color:var(--bg-text-dim); margin-top:6px; min-height:14px;}
  .wl-qr{display:grid; place-items:center; padding:14px; background:#fff; border-radius:16px; width:212px; margin:0 auto;}
  .wl-qr img,.wl-qr canvas{display:block;}
  .wl-recv{font:12px var(--mono,ui-monospace,Menlo,monospace); color:var(--bg-text); word-break:break-all; text-align:center; margin-top:12px; background:var(--field); padding:10px; border-radius:11px;}
  .wl-wlist{display:flex; flex-direction:column; gap:6px;}
  .wl-wrow{display:flex; align-items:center; gap:10px; border:none; background:var(--field); color:var(--bg-text); border-radius:12px; padding:11px 12px; cursor:pointer; text-align:left;}
  .wl-wm{flex:1; min-width:0; display:flex; flex-direction:column;} .wl-wm b{font-size:14px;} .wl-wm span{font-size:11px; color:var(--bg-text-dim); font-family:var(--mono,ui-monospace,Menlo,monospace);}
  .wl-check{color:#32d74b; font-weight:700;} .wl-rm{color:var(--bg-text-dim); width:24px; height:24px; display:grid; place-items:center; border-radius:7px;} .wl-rm:hover{background:rgba(255,69,58,.2); color:#ff6b62;}
  .sys-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .sys-card{background:var(--field); border-radius:14px; padding:12px 14px;}
  .sys-k{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--bg-text-dim);}
  .sys-v{font-size:17px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums; word-break:break-word;}
  .sys-v.hot{color:#ff9f0a;}
  .sys-load{color:var(--bg-text-dim); padding:20px; text-align:center;}
  /* health banner (throttle / undervoltage) */
  .sys-health{display:flex; align-items:center; gap:12px; padding:13px 15px; border-radius:14px; margin-bottom:12px; border:.5px solid transparent;}
  .sys-health .sh-dot{width:11px; height:11px; border-radius:50%; flex:0 0 auto;}
  .sys-health .sh-t{font-size:14px; font-weight:700;} .sys-health .sh-m{font-size:12px; color:var(--bg-text-dim); margin-top:1px;}
  .sys-health.ok{background:rgba(50,215,75,.12); border-color:rgba(50,215,75,.3);} .sys-health.ok .sh-dot{background:#32d74b; box-shadow:0 0 8px rgba(50,215,75,.8);}
  .sys-health.warn{background:rgba(255,159,10,.12); border-color:rgba(255,159,10,.34);} .sys-health.warn .sh-dot{background:#ff9f0a; box-shadow:0 0 8px rgba(255,159,10,.8);}
  .sys-health.bad{background:rgba(255,69,58,.14); border-color:rgba(255,69,58,.4);} .sys-health.bad .sh-dot{background:#ff453a; box-shadow:0 0 9px rgba(255,69,58,.9); animation:shPulse 1.1s ease-in-out infinite;}
  @keyframes shPulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .sys-sec{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--bg-text-dim); margin:16px 0 8px;}
  .sys-gov{display:flex; gap:7px; flex-wrap:wrap;}
  .gov-b{border:.5px solid var(--hairline); background:var(--field); color:var(--bg-text); border-radius:8px; padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer; transition:filter .15s,transform .1s;}
  .gov-b:hover{filter:brightness(1.18);} .gov-b:active{transform:scale(.94);}
  .gov-b.on{background:var(--accent,#2BE5FF); color:#04222a; border-color:transparent;}
  .sys-usb{display:flex; flex-direction:column; gap:5px;}
  .usb-row{font:11.5px/1.4 var(--mono,ui-monospace,Menlo,monospace); color:var(--bg-text-dim); background:var(--field); border-radius:9px; padding:7px 11px; word-break:break-word;}
  .sys-power{display:flex; gap:9px;} .sys-power .proj-b{padding:9px 16px; font-size:13px;}
  .sb-in{flex:1; min-width:0; border:none; outline:none; background:var(--field); color:var(--bg-text); border-radius:8px; padding:6px 12px; font-size:13px; font-family:inherit;}
  .sb-go,.site-bar .sb-ext{border:none; background:var(--accent); color:#fff; border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer;}
  .camapp{display:flex; flex-direction:column; align-items:center;}
  .cam-v{width:100%; max-height:74%; background:#000; border-radius:14px; object-fit:cover;}
  .cam-bar{display:flex; gap:14px; align-items:center; margin-top:14px;}
  .cam-shot{border:none; background:var(--accent); color:#fff; font-weight:600; border-radius:22px; padding:10px 22px; cursor:pointer; font-size:15px;}
  .cam-dl{color:var(--clive); font-weight:600; text-decoration:none;}
  .cam-msg{color:var(--bg-text-dim); font-size:13px; margin-top:8px; min-height:16px;}
  .mail-list{display:flex; flex-direction:column;}
  .mail-row{padding:11px 6px; border-bottom:.5px solid var(--hairline);}
  .mail-from{font-weight:700; font-size:14px;} .mail-sub{font-size:13.5px;} .mail-snip{font-size:12.5px; color:var(--bg-text-dim);}
  .gpio-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:5px;}
  .gpio-pin{display:flex; align-items:center; gap:8px; background:var(--field); border-radius:7px; padding:6px 10px; font-size:12px; font-variant-numeric:tabular-nums;}
  .gpio-dot{width:8px; height:8px; border-radius:50%; background:#febc2e;}
  .musicapp{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
  .mus-art{width:120px; height:120px; border-radius:18px; background:linear-gradient(150deg,#fc5c7d,#9a2bcf); display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .mus-art svg{width:54px; height:54px;} .mus-title{font-size:18px; font-weight:600; margin-top:16px;} .mus-sub{color:var(--bg-text-dim);}
  .mus-ctl{display:flex; gap:22px; align-items:center; margin-top:16px;} .mus-ctl button{border:none; background:none; color:var(--bg-text); font-size:26px; cursor:pointer;} .mus-ctl .mus-play{font-size:34px;}
  .pwapp .pw-card{background:var(--field); border-radius:14px; padding:13px 15px; margin-bottom:16px;}
  .pw-site{font-weight:600;} .pw-user{font-size:13px; color:var(--bg-text-dim); margin-top:2px;}
  .pw-sub{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--bg-text-dim); margin-bottom:6px;}
  .pk-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:.5px solid var(--hairline);}
  .pk-row .pk-ic{font-size:16px;} .pk-row .pk-nm{font-weight:600; font-size:14px;} .pk-row .pk-dt{margin-left:auto; font-size:12px; color:var(--bg-text-dim);}
  .pk-row .pk-rm{border:none; background:none; color:#ff5f57; font-size:15px; cursor:pointer; padding:2px 6px;}
  /* ---------- Projects (pm2 fleet) app ---------- */
  .projapp .proj-top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
  .projapp .proj-sub{font-size:11px; color:var(--bg-text-dim);}
  .proj-row{display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:.5px solid var(--hairline); font-size:13px;}
  .proj-d{width:8px; height:8px; border-radius:50%; background:#6b6b70; flex:0 0 auto;}
  .proj-d.live{background:#32d74b; box-shadow:0 0 6px rgba(50,215,75,.7);}
  .proj-d.err{background:#ff5f57; box-shadow:0 0 6px rgba(255,95,87,.7);}
  .proj-nm{font-weight:600; flex:0 0 auto; max-width:40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .proj-meta{color:var(--bg-text-dim); font-size:11px; font-variant-numeric:tabular-nums; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .proj-act{display:flex; gap:6px; flex:0 0 auto;}
  .proj-b{border:none; border-radius:7px; padding:4px 10px; font-size:12px; font-weight:600; cursor:pointer; background:var(--field); color:var(--bg-text); transition:filter .15s,transform .1s,background .2s;}
  .proj-b:hover{filter:brightness(1.18);} .proj-b:active{transform:scale(.94);}
  .proj-b.warn{color:#ff8a3d;} .proj-b.go{background:#32d74b; color:#04220c;}
  .proj-crit{color:#ffd60a; font-size:8px; margin-left:6px; vertical-align:middle; opacity:.85;}
  /* ---------- Services + Docker apps (reuse .proj-* rows) ---------- */
  .svcapp .proj-nm{max-width:none;} .svcapp .proj-meta{flex:1;}
  /* shared manager shell (header + filter + list) */
  .mgr-top{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .mgr-h{display:flex; align-items:baseline; gap:8px; flex:1; min-width:0;}
  .mgr-h b{font-size:15px;}
  .mgr-filter{flex:0 0 auto; width:130px; height:28px; border:none; border-radius:8px; padding:0 11px; font:12.5px var(--sf,system-ui);
    background:var(--field,rgba(125,125,135,.22)); color:var(--bg-text); transition:width .2s,box-shadow .2s;}
  .mgr-filter:focus{outline:none; width:160px; box-shadow:0 0 0 2px var(--accent,#2BE5FF) inset;}
  .mgr-empty{padding:26px 8px; text-align:center; color:var(--bg-text-dim); font-size:13px;}
  .mgr-list .proj-row,.mgr-list .dock-row{animation:mgrIn .25s ease;}
  @keyframes mgrIn{from{opacity:0; transform:translateY(3px);}to{opacity:1; transform:none;}}
  /* ---------- Activity Monitor ---------- */
  .act-seg{display:inline-flex; gap:2px; padding:2px; background:var(--field); border-radius:9px; margin-bottom:10px;}
  .act-seg button{border:none; background:transparent; color:var(--bg-text-dim); font:600 12.5px var(--sf,system-ui); padding:5px 14px; border-radius:7px; cursor:pointer; transition:background .2s,color .2s;}
  .act-seg button.on{background:var(--accent,#2BE5FF); color:#04222a;}
  .act-head{display:flex; align-items:center; padding:0 4px 6px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--bg-text-dim); border-bottom:.5px solid var(--hairline);}
  .act-head span:first-child{flex:1;}
  .act-head .act-cpu,.act-head .act-mem{flex:0 0 auto; width:74px; text-align:right;}
  .act-row{display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:.5px solid var(--hairline); font-size:13px;}
  .act-meta{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.25;}
  .act-nm{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .act-cmd{font-size:11px; color:var(--bg-text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .act-sub2{font-size:10.5px; color:var(--bg-text-dim); opacity:.7; font-variant-numeric:tabular-nums;}
  .act-cpu{flex:0 0 auto; width:74px; text-align:right; font-variant-numeric:tabular-nums;}
  .act-cpu .hi{color:#ff9f0a; font-weight:700;}
  .act-bar{height:3px; border-radius:2px; background:rgba(140,140,150,.22); margin-top:4px; overflow:hidden;}
  .act-bar i{display:block; height:100%; background:var(--accent,#2BE5FF); border-radius:2px; transition:width .4s var(--ease,ease);}
  .act-bar i.hi{background:#ff9f0a;}
  .act-mem{flex:0 0 auto; width:74px; text-align:right; font-variant-numeric:tabular-nums; color:var(--bg-text-dim);}
  /* ---------- Scheduled Jobs (cron) ---------- */
  .cron-group{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--bg-text-dim); margin:14px 0 6px; padding-left:2px;}
  .cron-group:first-child{margin-top:2px;}
  .cron-row{display:flex; align-items:flex-start; gap:11px; padding:9px 4px; border-bottom:.5px solid var(--hairline); font-size:13px; animation:mgrIn .25s ease;}
  .cron-sched{flex:0 0 auto; font:11px var(--mono,ui-monospace,Menlo,monospace); color:var(--accent,#2BE5FF); background:rgba(43,229,255,.1); padding:4px 8px; border-radius:7px; white-space:nowrap; margin-top:1px;}
  .cron-meta{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.3;}
  .cron-when{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cron-file{color:var(--bg-text-dim); font-weight:500;}
  .cron-cmd{font:11px/1.4 var(--mono,ui-monospace,Menlo,monospace); color:var(--bg-text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* ---------- Console (logs) ---------- */
  .conapp{display:flex; flex-direction:column; height:100%; padding:0 !important;}
  .con-bar{display:flex; align-items:center; gap:7px; padding:9px 12px; border-bottom:.5px solid var(--hairline); flex:0 0 auto; flex-wrap:wrap;}
  .con-sel{border:none; background:var(--field); color:var(--bg-text); border-radius:8px; padding:5px 9px; font:12.5px var(--sf,system-ui); cursor:pointer; max-width:180px;}
  .con-search{height:28px; width:130px;}
  .con-sp{flex:1;} .con-meta{font-size:11px; color:var(--bg-text-dim); font-variant-numeric:tabular-nums; margin-right:2px;}
  .con-bar .dl-btn.on{background:var(--accent,#2BE5FF); color:#04222a;}
  .con-pre{flex:1; margin:0; padding:10px 14px; overflow:auto; font:11.5px/1.55 var(--mono,ui-monospace,Menlo,monospace); white-space:pre-wrap; word-break:break-word; background:var(--win-bg,#0c0c10);}
  .con-pre .cl{display:block; color:var(--bg-text);}
  .con-pre .cl.err{color:#ff6b62;} .con-pre .cl.warn{color:#ffb340;} .con-pre .cl.dim{color:var(--bg-text-dim); opacity:.6;}
  .dockapp{position:relative;}
  .dock-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:.5px solid var(--hairline); font-size:13px;}
  .dock-meta{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.25;}
  .dock-nm{font-weight:600; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dock-nm:hover{color:var(--accent,#2BE5FF);}
  .dock-img{font-size:11px; color:var(--bg-text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dock-st{font-size:11px; color:var(--bg-text-dim); font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dock-logs{position:absolute; inset:0; background:var(--win-bg,#101014); display:flex; flex-direction:column; z-index:5; animation:mgrIn .2s ease;}
  .dl-bar{display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:.5px solid var(--hairline); font-size:13px;}
  .dl-bar b{flex:0 0 auto; max-width:45%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dl-meta{font-size:11px; color:var(--bg-text-dim); font-variant-numeric:tabular-nums;}
  .dl-sp{flex:1;}
  .dl-btn{border:none; background:var(--field); color:var(--bg-text); border-radius:7px; width:28px; height:28px; cursor:pointer; font-size:13px; transition:filter .15s,transform .1s;}
  .dl-btn:hover{filter:brightness(1.2);} .dl-btn:active{transform:scale(.92);}
  .dl-pre{flex:1; margin:0; padding:12px 14px; overflow:auto; font:11.5px/1.5 var(--mono,ui-monospace,Menlo,monospace); color:var(--bg-text); white-space:pre-wrap; word-break:break-word; transition:opacity .2s;}
  .dl-pre.loading{opacity:.5;}
  /* ---------- Remote Browser ---------- */
  .rbx{display:flex; flex-direction:column; height:100%; background:#0c0c10;}
  .rbx-bar{display:flex; align-items:center; gap:6px; padding:7px 9px; background:var(--bar,rgba(30,30,36,.9)); border-bottom:.5px solid var(--win-border,rgba(255,255,255,.08));}
  .rbx-b{border:none; background:var(--field,rgba(125,125,135,.25)); color:var(--bg-text,#fff); width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:15px; flex:0 0 auto; display:flex; align-items:center; justify-content:center;}
  .rbx-b:hover{background:rgba(140,140,150,.4);} .rbx-b:active{transform:scale(.92);}
  .rbx-addr{flex:1; min-width:0; display:flex; align-items:center; gap:7px; height:30px; border-radius:9px; padding:0 11px; background:var(--field,rgba(125,125,135,.22)); transition:box-shadow .2s;}
  .rbx-addr:focus-within{box-shadow:0 0 0 2px var(--accent,#2BE5FF) inset;}
  .rbx-lock{flex:0 0 auto; width:14px; height:14px; color:#32d74b; display:none;}
  .rbx-lock.on{display:block;} .rbx-lock svg{width:14px; height:14px;}
  .rbx-url{flex:1; min-width:0; height:100%; border:none; background:transparent; font:13px var(--sf,system-ui); color:var(--bg-text,#fff); outline:none;}
  .rbx-dot{width:9px; height:9px; border-radius:50%; background:#6b6b70; flex:0 0 auto; transition:background .3s;}
  .rbx-dot.on{background:#32d74b; box-shadow:0 0 7px rgba(50,215,75,.8);}
  /* speed-dial bookmarks strip */
  .rbx-marks{display:flex; gap:6px; align-items:center; padding:6px 9px; overflow-x:auto; background:var(--bar,rgba(30,30,36,.7)); border-bottom:.5px solid var(--win-border,rgba(255,255,255,.06)); scrollbar-width:none;}
  .rbx-marks::-webkit-scrollbar{display:none;}
  .rbx-mark{flex:0 0 auto; border:none; background:var(--field,rgba(125,125,135,.22)); color:var(--bg-text,#fff); font:600 12px var(--sf,system-ui); padding:5px 12px; border-radius:8px; cursor:pointer; white-space:nowrap; transition:filter .15s,transform .1s;}
  .rbx-mark:hover{filter:brightness(1.25);} .rbx-mark:active{transform:scale(.94);}
  /* navigation progress bar */
  .rbx-prog{height:2.5px; width:100%; position:relative; overflow:hidden; background:transparent; flex:0 0 auto;}
  .rbx-prog::after{content:""; position:absolute; left:0; top:0; height:100%; width:0; opacity:0;
    background:linear-gradient(90deg,var(--accent,#2BE5FF),#7b5bff); box-shadow:0 0 8px var(--accent,#2BE5FF);}
  .rbx-prog.run::after{width:80%; opacity:1; transition:width 1.5s cubic-bezier(.1,.6,.25,1);}
  .rbx-prog.done::after{width:100%; opacity:1; transition:width .2s ease, opacity .4s ease .15s;}
  .rbx-view{position:relative; flex:1; overflow:hidden; background:#000; display:flex;}
  .rbx-img{width:100%; height:100%; object-fit:contain; object-position:top center; cursor:crosshair; outline:none; user-select:none; transition:box-shadow .2s;}
  .rbx-img:focus-visible{box-shadow:0 0 0 2px var(--accent,#2BE5FF) inset;}

  .di{pointer-events:auto; width:88px; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; text-align:center;}
  .di .di-ic{width:56px;height:56px; display:flex;align-items:center;justify-content:center; filter:drop-shadow(0 5px 9px rgba(0,0,0,.45));}
  .di .di-ic svg{width:52px;height:52px; stroke-width:2.1;}
  .di .di-lbl{font-size:12px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.7); padding:1px 7px; border-radius:6px; line-height:1.3;}
  .di .di-sub{font-size:10.5px; color:rgba(255,255,255,.72); text-shadow:0 1px 2px rgba(0,0,0,.7);}
  .di:hover .di-lbl{background:rgba(43,127,255,.6);}
  /* widgets/icons need room — hide on phones where they'd cover everything */
  /* phones: hide desktop widgets/icons (no room); iPad (≥768) keeps them */
  @media (max-width:700px){ #widgets,#netwidget,#deskicons{display:none !important;} }
  /* phones: the dock has many icons — shrink it and let it scroll horizontally
     so nothing is cut off, and keep it clear of the home indicator. */
  @media (max-width:700px){
    #dock-wrap{ bottom:calc(8px + var(--safe-bottom)); padding:0 8px; }
    #dock{ gap:3px; padding:7px 8px; max-width:100%; overflow-x:auto; overflow-y:hidden;
      -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    #dock::-webkit-scrollbar{ display:none; }
    .dock-item{ flex:0 0 auto; width:46px; }
    .dock-icon{ width:46px !important; height:46px !important; }
    .dock-item .runningdot{ bottom:1px; }
  }
  /* iPad / tablet: comfortable touch targets, full desktop layout */
  @media (min-width:701px) and (max-width:1180px) and (pointer:coarse){
    :root{ --dock-base:58px; }
  }

  /* ---------- launchpad ---------- */
  #lp{position:fixed; inset:0; z-index:8500; display:none; flex-direction:column; align-items:center;
    padding:calc(var(--safe-top) + var(--menubar-h) + 24px) 0 70px; opacity:0; transition:opacity .22s var(--ease);
    background:rgba(10,12,22,.36); backdrop-filter:saturate(160%) blur(34px); -webkit-backdrop-filter:saturate(160%) blur(34px);}
  #lp.show{display:flex; opacity:1;}
  #lp.show .lp-grid{transform:scale(1);}
  #lp-search{width:min(440px,76vw); height:38px; border-radius:11px; border:none; outline:none; text-align:center;
    background:var(--field); color:var(--bg-text); font-size:15px; font-family:inherit; margin-bottom:30px;
    box-shadow:0 2px 10px rgba(0,0,0,.25);}
  #lp-search::placeholder{color:var(--bg-text-dim);}
  .lp-chips{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:min(680px,90vw); margin:14px 0 4px;}
  .lp-chip{padding:5px 14px; border-radius:15px; font-size:13px; font-weight:600; cursor:pointer; color:var(--bg-text);
    background:rgba(125,125,135,.22); border:.5px solid var(--win-border); transition:background .15s;}
  .lp-chip:hover{background:rgba(125,125,135,.34);}
  .lp-chip.on{background:var(--accent); color:#fff; border-color:transparent;}
  .lp-pages{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; width:100%; flex:1; scrollbar-width:none;}
  .lp-pages::-webkit-scrollbar{display:none;}
  .lp-page{flex:0 0 100%; scroll-snap-align:center; display:grid; grid-template-columns:repeat(6,1fr);
    grid-auto-rows:min-content; gap:26px 18px; align-content:start; justify-items:center;
    padding:6px clamp(20px,8vw,140px); transform:scale(.96); transition:transform .22s var(--ease);}
  @media (max-width:700px){ .lp-page{grid-template-columns:repeat(4,1fr); gap:24px 10px; padding:6px 18px;} }
  .lp-app{width:108px; display:flex; flex-direction:column; align-items:center; gap:9px; cursor:pointer; text-align:center;}
  .lp-app .lp-ic{position:relative; width:66px; height:66px; border-radius:23%; display:flex; align-items:center; justify-content:center;
    color:#fff; box-shadow:0 8px 20px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.32), inset 0 0 0 .5px rgba(255,255,255,.12); transition:transform .14s var(--ease); overflow:hidden;}
  .lp-app .lp-ic::after{content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.06) 40%, rgba(0,0,0,.04) 70%, rgba(0,0,0,.12) 100%);}
  .lp-app .lp-ic svg{width:52%; height:52%; fill:none; stroke:currentColor; stroke-width:1.7; position:relative; z-index:1; filter:drop-shadow(0 1px 1px rgba(0,0,0,.28));}
  .lp-app:hover .lp-ic{transform:scale(1.08);}
  .lp-app .lp-nm{font-size:13px; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.6);}
  .lp-dots{display:flex; gap:8px; justify-content:center; margin-top:18px;}
  .lp-dots i{width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.35); transition:background .2s;}
  .lp-dots i.on{background:rgba(255,255,255,.9);}

  /* ---------- spaces (virtual desktops) ---------- */
  #spaces{position:fixed; top:calc(var(--safe-top) + var(--menubar-h)); left:0; right:0; z-index:7000; display:none;
    justify-content:center; align-items:center; gap:16px; padding:20px; flex-wrap:wrap;
    background:rgba(8,11,22,.5); backdrop-filter:saturate(160%) blur(26px); -webkit-backdrop-filter:saturate(160%) blur(26px);
    border-bottom:.5px solid var(--win-border);}
  #spaces.show{display:flex;}
  .space-th{width:168px; height:98px; border-radius:11px; border:2px solid transparent; cursor:pointer; position:relative; overflow:hidden;
    box-shadow:0 8px 22px rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; color:#fff;
    background:radial-gradient(900px 500px at 70% 20%,#3a2a6b,transparent 60%),radial-gradient(700px 500px at 20% 90%,#0d4a63,transparent 60%),linear-gradient(160deg,#15121f,#0b1020); transition:border-color .15s,transform .15s;}
  .space-th:hover{transform:translateY(-2px);}
  .space-th.active{border-color:#2b7fff;}
  .space-th .lbl{font-size:12px; font-weight:500; padding:3px 9px; background:rgba(0,0,0,.45); border-radius:7px; margin-bottom:8px;}
  .space-th .cnt{position:absolute; top:6px; right:8px; font-size:11px; opacity:.7;}

  .space-th:hover .del{opacity:.6;}

  .space-add:hover{border-color:rgba(255,255,255,.6); color:#fff;}

  /* ---------- web-site apps (embedded) ---------- */

  .site-bar{flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:7px 10px; border-bottom:.5px solid var(--hairline); background:var(--titlebar);}
  .site-bar button{border:none; background:var(--field); color:var(--bg-text); border-radius:7px; padding:5px 10px; font-size:13px; cursor:pointer; font-family:inherit;}
  .site-bar button:hover{background:rgba(140,140,150,.3);}
  .site-bar .sb-url{flex:1; font-size:12px; color:var(--bg-text-dim); font-family:var(--mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .site-fallback.show{display:flex;} .site-frame.hide{display:none;}
  .site-fallback button{background:var(--accent); color:#fff; border:none; border-radius:9px; padding:10px 20px; font-size:14px; font-weight:600; cursor:pointer;}

<script>
/* ============================================================
   CONFIG — point these at your real KAY2Tunnel backend.
   Leave blank to run the built-in demo (works offline / in preview).
   ============================================================ */
/* Backend resolution. MacPiOs talks to the KAY2Tunnel backend (port 7420 on the
   Pi), reachable publicly via Cloudflare Tunnel at BACKEND_ORIGIN.
     • Served FROM the backend itself (the Pi over Tailscale, or the
       stan.spikeradar.co.uk tunnel) → same-origin, no cross-origin hop.
     • Served from anywhere else (e.g. Netlify) → point at BACKEND_ORIGIN.
       Auth then comes from ?token= / a one-time prompt (see authToken()).
     • Opened as a local file (location.host === "") → demo mode. */
const BACKEND_ORIGIN = "https://stan.spikeradar.co.uk";
const _isBackendHost = location.host && /(^|\.)spikeradar\.co\.uk$/.test(location.hostname)
  || /\.ts\.net$/.test(location.hostname) || /^(localhost|127\.0\.0\.1)/.test(location.hostname);
const _api   = !location.host ? "" : (_isBackendHost ? location.origin : BACKEND_ORIGIN);
const _wsApi = _api ? _api.replace(/^http/, 'ws') : "";
const CONFIG = {
  terminalWS : _wsApi ? `${_wsApi}/ws/term` : "",          // node-pty bridge (JSON frames)
  filesAPI   : _api   ? `${_api}/api/files/list?path=` : "", // GET → [{name,type,size,mtime}]
  chatAPI    : _api   ? `${_api}/api/clive` : "",          // REAL Clive: KAY2Tunnel proxy → OpenClaw gateway (same agent as Telegram). POST {message,session} → {reply}
  aiAPI      : _api   ? `${_api}/api/ai` : "",             // Ollama proxy: GET /models, POST /chat (NDJSON stream) — fallback when chatAPI is unset
  aiModel    : "",   // auto-picked from /api/ai/models on first message; set to pin a model

/* Stable per-install conversation id so Clive keeps context across messages AND
   reloads (mirrors how Telegram is one continuous session). Guarded for sandboxes. */
let _cliveSession = '';
function cliveSession(){
  if(_cliveSession) return _cliveSession;
  try{ let s=localStorage.getItem('kay2os_clive_session');
       if(!s){ s='kay2os-'+Math.random().toString(36).slice(2,10); localStorage.setItem('kay2os_clive_session',s); }
       return (_cliveSession=s); }catch(e){ return (_cliveSession='kay2os-'+Math.random().toString(36).slice(2,10)); }
}

/* ---------- KAY2Tunnel auth ----------
   All /api and WS upgrades require the AUTH_TOKEN from the Pi's .env, the same
   token the main KAY2Tunnel UI stores under localStorage['stan_token']. Served
   same-origin, MacPiOs reuses it transparently; cross-origin (Netlify) the lock
   screen collects + validates it on boot (see showLock/tryUnlock). ?token= is a
   share-link shortcut. All localStorage access is guarded for sandboxes. */
let _tokCache = null;
function authToken(){
  if(_tokCache) return _tokCache;
  try{ const t=localStorage.getItem('stan_token'); if(t) return (_tokCache=t); }catch(e){}
  try{ const q=new URLSearchParams(location.search).get('token');
       if(q){ _tokCache=q; try{localStorage.setItem('stan_token',q);}catch(e){}
         // Scrub the token from the URL immediately so it can't leak via browser
         // history, the address bar, referrers, or screenshots.
         try{ const u=new URL(location.href); u.searchParams.delete('token'); history.replaceState(null,'',u.pathname+u.search+u.hash); }catch(e){}
         return q; } }catch(e){}
  return '';
}
function authHeaders(){ const t=authToken(); return t ? {'Authorization':'Bearer '+t} : {}; }
/* User prefs (accent / dock size / theme) — applied at load, set from Settings. */
(function initPrefs(){ try{
  const a=localStorage.getItem('mac_accent'); if(a) document.documentElement.style.setProperty('--accent',a);
  const d=localStorage.getItem('mac_dock');   if(d) document.documentElement.style.setProperty('--dock-base',d+'px');
  const t=localStorage.getItem('mac_theme');  if(t) document.documentElement.setAttribute('data-theme',t);
  if((localStorage.getItem('mac_wall')||'photo')==='photo') document.documentElement.classList.add('wp-photo');
}catch(e){} })();
function applyWall(mode){ document.documentElement.classList.toggle('wp-photo',mode==='photo'); try{localStorage.setItem('mac_wall',mode);}catch(e){} }
function applyAccent(c){ document.documentElement.style.setProperty('--accent',c); try{localStorage.setItem('mac_accent',c);}catch(e){} }
function applyDock(px){ document.documentElement.style.setProperty('--dock-base',px+'px'); try{localStorage.setItem('mac_dock',px);}catch(e){} }
function withToken(url){ const t=authToken(); if(!t) return url; return url + (url.includes('?')?'&':'?') + 'token=' + encodeURIComponent(t); }
function fmtSize(b){ b=+b||0; if(b<1024) return b+' B'; if(b<1048576) return (b/1024).toFixed(b<10240?1:0)+' KB'; if(b<1073741824) return (b/1048576).toFixed(1)+' MB'; return (b/1073741824).toFixed(1)+' GB'; }

const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
/* iOS safe-area insets for JS layout math (window spawn/maximise). env() can't
   be read off a custom property, so probe a hidden element's computed padding.
   Recomputed on resize/rotate. SAFE.top includes the Dynamic Island region. */
let SAFE={top:0,right:0,bottom:0,left:0};
function measureSafe(){
  const p=el('div'); p.style.cssText='position:fixed;visibility:hidden;pointer-events:none;top:0;left:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);';
  document.body.appendChild(p); const cs=getComputedStyle(p);
  SAFE={top:parseFloat(cs.paddingTop)||0, right:parseFloat(cs.paddingRight)||0, bottom:parseFloat(cs.paddingBottom)||0, left:parseFloat(cs.paddingLeft)||0};
  p.remove();
}
measureSafe();
/* Live layout edges. The SAFE snapshot can be stale on an iPhone PWA (the
   safe-area insets often resolve to 0 at first paint and only become real once
   standalone fullscreen kicks in), which used to push a maximized window's
   titlebar UP behind the fixed menubar — making the close button unreachable.
   Reading the menubar's / dock's ACTUAL rendered edges is always correct, no
   matter when the insets resolve. */
function mbBottom(){ const m=document.getElementById('menubar'); return m ? m.getBoundingClientRect().bottom : (SAFE.top+28); }
function dockTopY(){ const d=document.getElementById('dock-wrap'); const r=d&&d.getBoundingClientRect(); return (r&&r.height) ? r.top : (innerHeight-92-SAFE.bottom); }

/* Web-site apps: embed the page in an iframe with a tiny toolbar; if the site
   refuses framing (X-Frame-Options) the user gets an "Open in new tab" fallback. */
function siteApp(id,name,url,grad,icon){ return { id, name, icon, grad, w:1080, h:720, opaque:true, mount(body){ mountSite(body,url,name); } }; }
function mountSite(body,url,name){
  const wrap=el('div','site');
  const bar=el('div','site-bar');
  bar.innerHTML=`<button class="sb-rl" title="Reload">⟳</button><span class="sb-url">${url}</span><button class="sb-ext">Open ↗</button>`;
  const frame=el('iframe','site-frame'); frame.src=url; frame.setAttribute('referrerpolicy','no-referrer');
  const fb=el('div','site-fallback',`<div>${name} can't be embedded here.</div><button>Open ${name} in a new tab</button>`);
  bar.querySelector('.sb-rl').addEventListener('click',()=>{ frame.src=url; });
  bar.querySelector('.sb-ext').addEventListener('click',()=>window.open(url,'_blank','noopener'));
  fb.querySelector('button').addEventListener('click',()=>window.open(url,'_blank','noopener'));
  // if it hasn't loaded in 6s (blocked frame), reveal the fallback
  let loaded=false; frame.addEventListener('load',()=>{ loaded=true; });
  setTimeout(()=>{ if(!loaded){ frame.classList.add('hide'); fb.classList.add('show'); } },6000);
  wrap.appendChild(bar); wrap.appendChild(frame); wrap.appendChild(fb); body.appendChild(wrap);
}

const AGENT_LIVE_IDS = AGENT_IDS.filter(id=>!APPS[id].missing); // pinned to dock; ⌃⌥1..N order

/* ============================================================
   WINDOW MANAGER
   ============================================================ */
let zTop = 100;
const openWindows = {}; // id -> {win, app, geom, minimized}

function focusWindow(id){
  const o = openWindows[id]; if(!o) return;
  document.querySelectorAll('.window').forEach(w=>w.classList.remove('focused'));
  o.win.classList.add('focused');
  o.win.style.zIndex = (++zTop);
  $('#mb-appname').textContent = o.app.name;
}

function launchApp(id){
  const app = APPS[id]; if(!app) return;
  if(openWindows[id]){
    if(openWindows[id].minimized) restoreWindow(id); else focusWindow(id);
    return;
  }
  bounceDock(id);
  const win = el('div','window'+(app.opaque?' opaque':''));
  const area = { top:mbBottom()+6, left:0, right:innerWidth, bottom:dockTopY()-8 };
  const w = Math.min(app.w, innerWidth-40), h = Math.min(app.h, area.bottom-area.top-20);
  const left = Math.round((innerWidth - w)/2 + (Object.keys(openWindows).length*26)%120 - 60);
  const top  = Math.round(area.top + 30 + (Object.keys(openWindows).length*22)%90);
  win.style.cssText += `;width:${w}px;height:${h}px;left:${Math.max(8,left)}px;top:${top}px;`;
  win.innerHTML = `
    <div class="titlebar">
      <div class="lights">
        <span class="light l-close">${svg('<line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/>')}</span>
        <span class="light l-min">${svg('<line x1="5" y1="12" x2="19" y2="12"/>')}</span>
        <span class="light l-max">${svg('<polyline points="7 13 7 7 13 7"/><polyline points="17 11 17 17 11 17"/>')}</span>
      </div>
      <div class="wt">${app.name}</div>
    </div>
    <div class="win-body"></div>`;
  ["n","s","e","w","ne","nw","se","sw"].forEach(d=>{ const r=el('div','rz rz-'+d); r.dataset.dir=d; win.appendChild(r); });
  $('#windows').appendChild(win);
  openWindows[id] = { win, app, minimized:false, prev:null, space:curSpace };
  const _di=dockItem(id); if(_di) _di.classList.add('running');   // not all apps are pinned to the dock

  app.mount(win.querySelector('.win-body'));
  wireWindow(id, win);
  focusWindow(id);
  openWindow_anim(win, id, Math.max(8,left), top, w, h);
}
/* open animation: genie-scale up from the app's dock icon; spring-in otherwise. */
function openWindow_anim(win, id, left, top, w, h){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){ return; }
  const dEl=dockItem(id), di=dEl&&dEl.getBoundingClientRect();
  if(di && di.width){
    const tx=(di.left+di.width/2)-(left+w/2), ty=(di.top+di.height/2)-(top+h/2);
    win.style.transformOrigin='center'; win.style.opacity='0'; win.style.transform=`translate(${tx}px,${ty}px) scale(.12)`;
    requestAnimationFrame(()=>{ win.style.transition='transform .34s cubic-bezier(.18,.84,.26,1), opacity .26s ease';
      win.style.transform='translate(0,0) scale(1)'; win.style.opacity='1';
      setTimeout(()=>{ win.style.transition=''; win.style.transform=''; win.style.opacity=''; },370); });
  } else { win.classList.add('appearing'); }
}

function closeWindow(id){
  const o=openWindows[id]; if(!o) return;
  if(o.cleanup){ try{o.cleanup();}catch(e){} }   // app-supplied teardown (timers, camera streams…)
  if(o.term){ try{o.term.dispose();}catch(e){} }
  if(o.ws){ try{o.ws.close();}catch(e){} }
  o.win.style.transform='scale(.94)'; o.win.style.opacity='0';
  setTimeout(()=>{ o.win.remove(); }, 160);
  delete openWindows[id];
  const di=dockItem(id); if(di) di.classList.remove('running');   // about/extras apps have no dock item
  const rest=Object.keys(openWindows); if(rest.length) focusWindow(rest[rest.length-1]); else $('#mb-appname').textContent='Finder';
}

function minimizeWindow(id){
  const o=openWindows[id]; if(!o||o.minimized) return;
  const dEl=dockItem(id);
  const di=dEl?dEl.getBoundingClientRect():{left:innerWidth/2,top:innerHeight,width:0,height:0}; // fallback for non-dock apps
  const wr=o.win.getBoundingClientRect();
  const tx=(di.left+di.width/2)-(wr.left+wr.width/2);
  const ty=(di.top+di.height/2)-(wr.top+wr.height/2);
  o.win.style.transformOrigin='center';
  o.win.style.transform=`translate(${tx}px,${ty}px) scale(.08)`;
  o.win.style.opacity='0';
  o.minimized=true;
  setTimeout(()=>{ o.win.style.display='none'; o.win.style.transform=''; o.win.style.opacity=''; },190);
}
function restoreWindow(id){
  const o=openWindows[id]; if(!o) return;
  o.win.style.display='flex'; o.minimized=false; focusWindow(id);
  if(o.fit){ setTimeout(()=>{try{o.fit.fit();}catch(e){}},60); }
}
function toggleMax(id){
  const o=openWindows[id]; if(!o) return;
  if(o.prev){ Object.assign(o.win.style, o.prev); o.prev=null; }
  else{
    o.prev={left:o.win.style.left,top:o.win.style.top,width:o.win.style.width,height:o.win.style.height};
    const top=mbBottom()+6, left=Math.max(6, SAFE.left+6);
    o.win.style.left=left+'px'; o.win.style.top=top+'px';
    o.win.style.width=(innerWidth-left-(6+SAFE.right))+'px'; o.win.style.height=Math.max(200, dockTopY()-8-top)+'px';
  }
  if(o.fit) setTimeout(()=>{try{o.fit.fit();}catch(e){}},120);
}

/* window snapping — drag a titlebar to a screen edge/corner to tile it (halves,
   quarters, full). A live cyan preview shows the target before you release. */
function _deskArea(){ const t=mbBottom()+6, l=6+(SAFE.left||0), r=innerWidth-6-(SAFE.right||0), b=dockTopY()-8; return {t,l,r,b,w:r-l,h:b-t}; }
function snapZone(x,y){ const a=_deskArea(), E=34, hw=Math.round(a.w/2), hh=Math.round(a.h/2);
  const L=x<=a.l+E, R=x>=a.r-E, T=y<=a.t+E, B=y>=a.b-E;
  if(L&&T) return {left:a.l,top:a.t,width:hw,height:hh};
  if(R&&T) return {left:a.l+hw,top:a.t,width:a.w-hw,height:hh};
  if(L&&B) return {left:a.l,top:a.t+hh,width:hw,height:a.h-hh};
  if(R&&B) return {left:a.l+hw,top:a.t+hh,width:a.w-hw,height:a.h-hh};
  if(T) return {left:a.l,top:a.t,width:a.w,height:a.h};
  if(L) return {left:a.l,top:a.t,width:hw,height:a.h};
  if(R) return {left:a.l+hw,top:a.t,width:a.w-hw,height:a.h};
  return null;
}
let _snapEl=null;
function snapPreview(geo){
  if(!geo){ if(_snapEl) _snapEl.classList.remove('show'); return; }
  if(!_snapEl){ _snapEl=el('div'); _snapEl.id='snap-preview'; document.body.appendChild(_snapEl); }
  _snapEl.style.left=geo.left+'px'; _snapEl.style.top=geo.top+'px'; _snapEl.style.width=geo.width+'px'; _snapEl.style.height=geo.height+'px';
  requestAnimationFrame(()=>_snapEl.classList.add('show'));
}

function wireWindow(id, win){
  const o=openWindows[id];
  win.addEventListener('pointerdown', ()=>focusWindow(id), true);
  win.querySelector('.l-close').addEventListener('click', e=>{e.stopPropagation(); closeWindow(id);});
  win.querySelector('.l-min').addEventListener('click', e=>{e.stopPropagation(); minimizeWindow(id);});
  win.querySelector('.l-max').addEventListener('click', e=>{e.stopPropagation(); toggleMax(id);});
  const tb=win.querySelector('.titlebar');
  tb.addEventListener('dblclick', e=>{ if(!e.target.closest('.light')) toggleMax(id); });
  // drag (with edge/corner snapping)
  tb.addEventListener('pointerdown', e=>{
    if(e.target.closest('.light')) return;
    const sx=e.clientX, sy=e.clientY, ol=win.offsetLeft, ot=win.offsetTop; let zone=null, moved=false;
    const mv=ev=>{ const dx=ev.clientX-sx, dy=ev.clientY-sy; if(!moved && Math.abs(dx)+Math.abs(dy)<4) return; moved=true;
      win.style.left=Math.max(0,ol+dx)+'px'; win.style.top=Math.max(mbBottom(),ot+dy)+'px';
      zone=snapZone(ev.clientX, ev.clientY); snapPreview(zone); };
    const up=()=>{ document.removeEventListener('pointermove',mv); document.removeEventListener('pointerup',up); snapPreview(null);
      if(zone){ if(!o.prev) o.prev={left:win.style.left,top:win.style.top,width:win.style.width,height:win.style.height};
        win.style.transition='left .2s var(--ease),top .2s var(--ease),width .2s var(--ease),height .2s var(--ease)';
        win.style.left=zone.left+'px'; win.style.top=zone.top+'px'; win.style.width=zone.width+'px'; win.style.height=zone.height+'px';
        setTimeout(()=>{ win.style.transition=''; if(o.fit){try{o.fit.fit();}catch(_){}} },230); } };
    document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
  });
  // resize
  win.querySelectorAll('.rz').forEach(h=>{
    h.addEventListener('pointerdown', e=>{
      e.stopPropagation(); const dir=h.dataset.dir;
      const sx=e.clientX, sy=e.clientY, ow=win.offsetWidth, oh=win.offsetHeight, ol=win.offsetLeft, ot=win.offsetTop;
      const mv=ev=>{
        const dx=ev.clientX-sx, dy=ev.clientY-sy, a=_deskArea(), SNAP=14, mX=a.l+a.w/2, mY=a.t+a.h/2;
        let nl=ol, nt=ot, nw=ow, nh=oh;
        if(dir.includes('e')) nw=Math.max(320,ow+dx);
        if(dir.includes('s')) nh=Math.max(200,oh+dy);
        if(dir.includes('w')){ nw=Math.max(320,ow-dx); nl=ol+(ow-nw); }
        if(dir.includes('n')){ nh=Math.max(200,oh-dy); nt=Math.max(mbBottom(),ot+(oh-nh)); }
        // snap edges to the screen boundary or the half-screen midline
        if(dir.includes('e')){ const rt=nl+nw; if(Math.abs(rt-a.r)<SNAP) nw=a.r-nl; else if(Math.abs(rt-mX)<SNAP) nw=mX-nl; }
        if(dir.includes('w')){ if(Math.abs(nl-a.l)<SNAP){ nw+=nl-a.l; nl=a.l; } else if(Math.abs(nl-mX)<SNAP){ nw+=nl-mX; nl=mX; } }
        if(dir.includes('s')){ const bt=nt+nh; if(Math.abs(bt-a.b)<SNAP) nh=a.b-nt; else if(Math.abs(bt-mY)<SNAP) nh=mY-nt; }
        if(dir.includes('n')){ if(Math.abs(nt-a.t)<SNAP){ nh+=nt-a.t; nt=a.t; } else if(Math.abs(nt-mY)<SNAP){ nh+=nt-mY; nt=mY; } }
        win.style.width=Math.max(320,nw)+'px'; win.style.height=Math.max(200,nh)+'px'; win.style.left=nl+'px'; win.style.top=Math.max(mbBottom(),nt)+'px';
        if(o.fit){ try{o.fit.fit();}catch(_){} }
      };
      const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);};
      document.addEventListener('pointermove',mv); document.addEventListener('pointerup',up);
    });
  });
}

const dock=$('#dock');
function dockItem(id){ return dock.querySelector(`.dock-item[data-app="${id}"]`); }
function buildDock(){
  const lp=el('div','dock-item'); lp.dataset.app='launchpad';

    <div class="runningdot"></div>`;
  lp.addEventListener('click',openLaunchpad);

    const a=APPS[id];

    item.addEventListener('click',()=>launchApp(id));

  dock.appendChild(trash);
}
function bounceDock(id){ const i=dockItem(id); if(!i) return; i.classList.add('bouncing'); setTimeout(()=>i.classList.remove('bouncing'),1100); }

dock.addEventListener('pointermove', e=>{
  const items=[...dock.querySelectorAll('.dock-item')];
  const MAX=1.85, R=130, base=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dock-base'));
  items.forEach(it=>{
    const r=it.getBoundingClientRect(), c=r.left+r.width/2, d=Math.abs(e.clientX-c);
    let s=1; if(d<R){ s=1+(MAX-1)*Math.pow(Math.cos((d/R)*(Math.PI/2)),1.6); }
    it.querySelector('.dock-icon').style.transform=`scale(${s})`;
    it.style.width=(base*(1+(s-1)*0.55))+'px';
  });
});
dock.addEventListener('pointerleave', ()=>{
  dock.querySelectorAll('.dock-item').forEach(it=>{ it.querySelector('.dock-icon').style.transform=''; it.style.width=''; });
});

/* Agent apps = a branded header bar (icon, name, live tmux pill) on top of the
   normal terminal pty. Makes a persistent CLI agent feel like a first-class app
   rather than a bare black box — and the pill mirrors the dock/switcher dots. */
function mountAgent(body, app){
  const a=AGENTS[app.agentKey];
  body.classList.add('agent-win');
  const bar=el('div','agent-bar'); bar.dataset.session=a.session;
  bar.innerHTML=`<span class="ab-ic" style="background:${a.grad}">${a.icon}</span>`+
    `<span class="ab-name">${esc(a.name)}</span>`+
    `<span class="ab-meta">tmux:${esc(a.session)} · ${esc(a.dir)}</span>`+
    `<span class="ab-spacer"></span>`+
    `<span class="ab-pill"><span class="ab-dot"></span><span class="ab-status">…</span></span>`;
  const wrap=el('div','agent-termwrap');
  body.appendChild(bar); body.appendChild(wrap);
  setAgentBar(bar, _agLive.has(a.session));   // reflect last-known state at once
  mountTerminal(wrap);                          // pty fills the wrap, below the bar
  try{ pollAgents(); }catch(e){}                // kick a fresh poll so the pill is current
}
function setAgentBar(bar, live){
  bar.classList.toggle('live', !!live);
  const s=bar.querySelector('.ab-status'); if(s) s.textContent = live ? 'live' : 'starting…';
}
function mountTerminal(body){
  const host=el('div','term-host'); body.appendChild(host);
  const o=Object.values(openWindows).find(w=>w.win.contains(body));
  if(!window.Terminal){ host.innerHTML='<div style="color:#0f0;font-family:var(--mono);padding:10px">xterm failed to load (offline preview)</div>'; return; }
  const term=new Terminal({fontFamily:'var(--mono)', fontSize:13, cursorBlink:true, theme:{background:'#000000', foreground:'#e6e6e6', cursor:'#2BE5FF'}});
  let fit; try{ fit=new FitAddon.FitAddon(); term.loadAddon(fit);}catch(e){}
  term.open(host); try{fit&&fit.fit();}catch(e){}
  o.term=term; o.fit=fit;
  setTimeout(()=>{try{fit&&fit.fit();}catch(e){}},80);

  if(CONFIG.terminalWS){
    // REAL MODE: bridge to KAY2Tunnel node-pty over WebSocket (JSON frames).
    const ws=new WebSocket(withToken(CONFIG.terminalWS)); o.ws=ws;
    const sendResize=()=>{ try{ if(ws.readyState===1 && term.cols) ws.send(JSON.stringify({type:'resize',cols:term.cols,rows:term.rows})); }catch(e){} };
    o._sendResize=sendResize;
    const ptyCmd = o.app && o.app.ptyCmd;   // e.g. Hermz auto-launches `hermes`
    ws.onopen=()=>{ try{fit&&fit.fit();}catch(e){} sendResize();
      // Auto-run the app's launch command once the shell prompt is ready.
      if(ptyCmd){ term.write('\x1b[2m· launching '+((o.app&&o.app.launchLabel)||ptyCmd)+'…\x1b[0m\r\n');
        setTimeout(()=>{ try{ if(ws.readyState===1) ws.send(JSON.stringify({type:'input',data:ptyCmd+'\n'})); }catch(e){} },500); } };
    ws.onmessage=ev=>{ let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
      if(m.type==='output') term.write(m.data);
      else if(m.type==='exit') term.write('\r\n\x1b[31m[session ended]\x1b[0m\r\n'); };
    ws.onclose=()=>term.write('\r\n\x1b[31m[disconnected]\x1b[0m\r\n');
    ws.onerror=()=>term.write('\r\n\x1b[31m[connection error — check the auth token]\x1b[0m\r\n');
    term.onData(d=>{ if(ws.readyState===1) ws.send(JSON.stringify({type:'input',data:d})); });
    try{ term.onResize && term.onResize(()=>sendResize()); }catch(e){}
  } else {
    demoShell(term);
  }
}
function demoShell(term){
  const P=()=>`\x1b[36m${CONFIG.user}@${CONFIG.hostname}\x1b[0m:\x1b[34m~\x1b[0m$ `;
  const fs={'README.md':'MacPiOs demo shell. Set CONFIG.terminalWS to attach a real node-pty session.','clive.log':'[clive] heartbeat ok','notes.txt':'no talk just make'};
  term.writeln('\x1b[38;5;81mMacPiOs\x1b[0m demo shell — type \x1b[1mhelp\x1b[0m. (offline; set CONFIG.terminalWS for the real Pi)');
  term.write('\r\n'+P());
  let buf='';
  term.onData(d=>{
    if(d==='\r'){ term.write('\r\n'); run(buf.trim()); buf=''; term.write(P()); }
    else if(d==='\u007f'){ if(buf){buf=buf.slice(0,-1); term.write('\b \b');} }
    else if(d>=' '){ buf+=d; term.write(d); }
  });
  function run(c){
    const [cmd,...a]=c.split(/\s+/);
    if(!cmd) return;
    if(cmd==='help') term.writeln('commands: ls  cat <f>  echo <..>  whoami  date  neofetch  clive  clear');
    else if(cmd==='ls') term.writeln(Object.keys(fs).join('   '));
    else if(cmd==='cat') term.writeln(fs[a[0]]!=null?fs[a[0]]:'cat: '+a[0]+': No such file');
    else if(cmd==='echo') term.writeln(a.join(' '));
    else if(cmd==='whoami') term.writeln(CONFIG.user);
    else if(cmd==='date') term.writeln(new Date().toString());
    else if(cmd==='clive') term.writeln('\x1b[38;5;81mClive\x1b[0m: trading engine nominal. whales: 49 tracked.');
    else if(cmd==='clear') term.clear();
    else if(cmd==='neofetch'){
      ['\x1b[38;5;81m      .--.\x1b[0m      '+CONFIG.user+'@'+CONFIG.hostname,
       '\x1b[38;5;81m     |o_o |\x1b[0m     ---------------',
       '\x1b[38;5;81m     |:_/ |\x1b[0m     OS: MacPiOs (web shell)',
       '\x1b[38;5;81m    //   \\ \\\x1b[0m    Host: Raspberry Pi',
       '\x1b[38;5;81m   (|     | )\x1b[0m   Shell: demo (offline)',
       '\x1b[38;5;81m  /\'\\_   _/`\\\x1b[0m   WM: MacPiOs window manager',
       '\x1b[38;5;81m  \\___)=(___/\x1b[0m   Accent: #2BE5FF'].forEach(l=>term.writeln(l));
    }
    else term.writeln(cmd+': command not found');
  }
}

  const toRel=path=>String(path||'').replace(/^~\/?/,'').replace(/^\/+/,'');
  const join=(a,b)=> (a?a+'/':'')+b;

  async function op(method,path,opts){ const r=await fetch(fapi(path),Object.assign({method,headers:authHeaders()},opts));
    if(!r.ok){ let m='HTTP '+r.status; try{ const j=await r.json(); if(j&&j.error)m=j.error; }catch(e){} throw new Error(m); } return r; }
  function reload(){ loadDir('~/'+curRel); }

  async function newFolder(){ if(!live()){ toast('Demo mode — wire CONFIG to edit'); return; }
    const name=prompt('New folder name:'); if(!name) return;
    try{ await op('POST','/mkdir',{headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({path:join(curRel,name)})}); toast('Folder created'); reload(); }
    catch(e){ toast('mkdir: '+e.message); } }
  async function rename(it){ if(!live()){ toast('Demo mode — wire CONFIG to edit'); return; }
    const name=prompt('Rename to:',it.name); if(!name||name===it.name) return;
    const dir=it.path.split('/').slice(0,-1).join('/');
    try{ await op('POST','/rename',{headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({from:it.path,to:join(dir,name)})}); toast('Renamed'); reload(); }
    catch(e){ toast('rename: '+e.message); } }
  async function del(it){ if(!live()){ toast('Demo mode — wire CONFIG to edit'); return; }
    if(!confirm(`Delete “${it.name}”${it.dir?' and everything inside it':''}?`)) return;
    try{ await op('DELETE','/?path='+encodeURIComponent(it.path)); toast('Deleted'); reload(); }
    catch(e){ toast('delete: '+e.message); } }
  function download(it){ if(!live()) return; const a=el('a'); a.href=withToken(fapi('/download?path='+encodeURIComponent(it.path))); a.download=it.name; document.body.appendChild(a); a.click(); a.remove(); }
  function upload(){ if(!live()){ toast('Demo mode — wire CONFIG to edit'); return; }
    const inp=el('input'); inp.type='file'; inp.onchange=async()=>{ const f=inp.files&&inp.files[0]; if(!f) return;
      const fd=new FormData(); fd.append('file',f); fd.append('path',curRel);
      try{ const r=await fetch(fapi('/upload'),{method:'POST',headers:authHeaders(),body:fd}); if(!r.ok) throw new Error('HTTP '+r.status); toast('Uploaded '+f.name); reload(); }
      catch(e){ toast('upload: '+e.message); } };
    inp.click(); }

  async function preview(it){
    const ext=it.name.toLowerCase();

      ov.innerHTML=`<div class="fp-bar"><b>${esc(it.name)}</b><span class="fp-meta" id="fp-meta"></span><span class="fp-sp"></span><button class="dl-btn" id="fp-save" title="Save">⤓ Save</button><button class="dl-btn" id="fp-dl" title="Download">⤓</button><button class="dl-btn fp-x" title="Close">✕</button></div><textarea class="fp-pre" spellcheck="false">Loading…</textarea>`;
