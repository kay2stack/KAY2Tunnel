      try{ const r=await op('GET','/read?path='+encodeURIComponent(it.path)); const t=await r.text(); ta.value=t; meta.textContent=t.split('\n').length+' lines'; }
      catch(e){
        if(/\b40[34]\b/.test(e.message) && /^\./.test(it.name)){ ta.value='“'+it.name+'” is a hidden / system file.\n\nFor security, the web API doesn’t serve dotfiles (they may hold keys or secrets). Open it from the Terminal app if you need to view it.'; }
        else ta.value='Could not read file: '+e.message;
        ta.readOnly=true; saveBtn.style.display='none'; meta.textContent='read-only';
      }
      saveBtn.onclick=async()=>{ if(!live()){ toast('Demo mode'); return; }
        try{ await op('PUT','/write',{headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({path:it.path,content:ta.value})}); toast('Saved '+it.name); }
        catch(e){ toast('save: '+e.message); } };
    } else {
      ov.innerHTML=`<div class="fp-bar"><b>${esc(it.name)}</b><span class="fp-sp"></span><button class="dl-btn" id="fp-dl" title="Download">⤓</button><button class="dl-btn fp-x" title="Close">✕</button></div><div class="fp-bin">Binary file — download to view.</div>`;
    }
    ov.querySelector('.fp-x').onclick=close;
    const dl=ov.querySelector('#fp-dl'); if(dl) dl.onclick=()=>download(it);
    ov.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
  }

  function render(items,opts){
    main.innerHTML='';
    const tools=el('div','files-tools');
    const crumb = '~'+(curRel?' / '+curRel.replace(/\//g,' / '):'');
    tools.innerHTML=`<span class="ft-path" title="${esc(curRel||'~')}">${esc(crumb)}</span><span class="ft-sp"></span>`+
      (live()?`<button class="ft-b" id="ft-new">＋ Folder</button><button class="ft-b" id="ft-up">⤒ Upload</button>`:'')+
      `<button class="ft-b" id="ft-rf" title="Refresh">⟳</button>`;
    main.appendChild(tools);
    if(live()){ tools.querySelector('#ft-new').onclick=newFolder; tools.querySelector('#ft-up').onclick=upload; }
    tools.querySelector('#ft-rf').onclick=reload;
    if(opts&&opts.error){ main.appendChild(el('div','files-msg','⚠ '+esc(opts.error))); return; }
    const list=el('div','files-list'); main.appendChild(list);
    items.forEach(it=>{
      const isUp=it.name==='..';
      const fr=el('div','fr'+(it.dir?' isdir':''),`<span class="fi">${isUp?'↩︎':(it.dir?'📁':'📄')}</span><span class="fn">${esc(it.name)}</span><span class="meta">${esc(it.meta||'')}</span><span class="fr-act"></span>`);
      const act=fr.querySelector('.fr-act');
      if(it.dir){ fr.addEventListener('dblclick',()=>loadDir('~/'+(it.path||''))); }
      else { fr.addEventListener('dblclick',()=>preview(it)); }
      if(live() && !isUp){
        const mk=(label,title,fn,cls)=>{ const b=el('button','fa-b'+(cls?' '+cls:''),label); b.title=title; b.onclick=e=>{ e.stopPropagation(); fn(); }; return b; };
        if(!it.dir) act.appendChild(mk('⤓','Download',()=>download(it)));
        act.appendChild(mk('✎','Rename',()=>rename(it)));
        act.appendChild(mk('🗑','Delete',()=>del(it),'danger'));
      }
      // right-click / long-press → context menu (same actions as the hover buttons)
      if(!isUp){
        const fileCtx=ev=>{ const m=[ ['Open', ()=>it.dir?loadDir('~/'+(it.path||'')):preview(it)] ];
          if(live()){ if(!it.dir) m.push(['Download', ()=>download(it)]); m.push(null,['Rename', ()=>rename(it)],['Delete', ()=>del(it), {danger:true}]); }
          ctxMenu(m, {x:ev.clientX, y:ev.clientY}); };
        fr.addEventListener('contextmenu', e=>{ e.preventDefault(); fileCtx(e); });
        if(typeof onLongPress==='function') onLongPress(fr, fileCtx);
      }
      list.appendChild(fr);
    });
    if(!items.length) list.appendChild(el('div','files-msg','Empty folder'));
  }
  async function loadDir(path){
    if(live()){
      const rel=toRel(path); curRel=rel;
      try{
        const r=await fetch(CONFIG.filesAPI+encodeURIComponent(rel),{headers:authHeaders()});
        if(!r.ok) throw new Error('HTTP '+r.status+(r.status===401?' (auth token)':''));
        const j=await r.json();
        if(!Array.isArray(j)) throw new Error((j&&j.error)||'unexpected response');
        const items=j.map(e=>({ name:e.name, dir:e.type==='dir', meta:e.type==='dir'?'':fmtSize(e.size), path:join(rel,e.name) }))
          .sort((a,b)=>((a.dir?0:1)-(b.dir?0:1))||a.name.localeCompare(b.name));
        if(rel) items.unshift({ name:'..', dir:true, path:rel.split('/').slice(0,-1).join('/') });
        render(items); return;
      }catch(e){ render([],{error:e.message+' ('+(rel||'~')+')'}); return; }
    }
    // demo data
    curRel=toRel(path);
    const demo={
      '~':[{name:'projects',dir:true},{name:'clive',dir:true},{name:'kay2tunnel',dir:true},{name:'README.md',meta:'1 KB'},{name:'.zshrc',meta:'2 KB'}],
      '~/projects':[{name:'SubSlash',dir:true},{name:'Wildling',dir:true},{name:'Spool',dir:true},{name:'GLINT',dir:true}],
      '~/clive':[{name:'index.js',meta:'14 KB'},{name:'strategies',dir:true},{name:'clive.log',meta:'310 KB'},{name:'whales.json',meta:'88 KB'}],
      '~/kay2tunnel':[{name:'server.js',meta:'9 KB'},{name:'public',dir:true},{name:'kay2os.html',meta:'MacPiOs'}],
      '~/spool':[{name:'CLAUDE.md',meta:'6 KB'},{name:'pipeline.js',meta:'—'}]
    };
    render((demo[path]||[]).map(d=>Object.assign({path:join(curRel,d.name)},d)));
  }
  loadDir(window._filesStart||'~'); window._filesStart=null;
}

async function pickModel(){

  try{

    const pref=list.find(m=>/llama3/i.test(m.name))||list.find(m=>/qwen/i.test(m.name))||list[0];

function mountClive(body){
  const live = CONFIG.chatAPI || CONFIG.aiAPI;
  const wrap=el('div','chat');
  const log=el('div','log');
  const greet = CONFIG.chatAPI ? "Connected to the live Clive (same brain as Telegram). What do you need?"
              : CONFIG.aiAPI   ? "Connected. What do you need?"
              : "Demo mode — serve MacPiOs from KAY2Tunnel to talk to the real Clive. Try me anyway.";
  log.appendChild(el('div','bubble ai',`<b>Clive</b>\n${esc(greet)}`));
  const bar=el('div','inbar');
  const inp=el('input'); inp.placeholder='Message Clive…';
  const btn=el('button',null,'Send');
  bar.appendChild(inp); bar.appendChild(btn);
  wrap.appendChild(log); wrap.appendChild(bar); body.appendChild(wrap);
  const history=[];   // {role,content} chat history for this window
  async function send(){
    const t=inp.value.trim(); if(!t) return; inp.value='';
    log.appendChild(el('div','bubble me',esc(t))); log.scrollTop=log.scrollHeight;
    const out=el('div','bubble ai','<b>Clive</b>\n…'); log.appendChild(out); log.scrollTop=log.scrollHeight;
    history.push({role:'user',content:t});
    const put=s=>{ out.innerHTML='<b>Clive</b>\n'+esc(s); log.scrollTop=log.scrollHeight; };
    if(CONFIG.chatAPI){
      // REAL CLIVE: KAY2Tunnel /api/clive proxy → OpenClaw gateway. Same agent,
      // memory and tools as Telegram; the gateway token stays server-side. A
      // stable session id keeps the conversation continuous. Agent turns can be
      // slow (it may use tools), so this is non-streaming with a clear pending state.
      btn.disabled=true; inp.disabled=true;
      try{
        const r=await fetch(CONFIG.chatAPI,{method:'POST',
          headers:Object.assign({'Content-Type':'application/json'},authHeaders()),
          body:JSON.stringify({message:t, session:cliveSession()})});
        let j={}; try{ j=await r.json(); }catch(e){}
        const reply = r.ok ? (j.reply||j.message||'(no response)') : ('⚠ '+(j.error||('HTTP '+r.status+(r.status===401?' — check the auth token':''))));
        history.push({role:'assistant',content:reply}); put(reply);
      }catch(e){ put('⚠ could not reach Clive ('+e.message+')'); }
      finally{ btn.disabled=false; inp.disabled=false; inp.focus(); }
    } else if(CONFIG.aiAPI){
      // FALLBACK: stream NDJSON from KAY2Tunnel's Ollama proxy.
      const model=await pickModel();
      if(!model){ put('⚠ no Ollama models available'); return; }
      try{
        const r=await fetch(CONFIG.aiAPI+'/chat',{method:'POST',
          headers:Object.assign({'Content-Type':'application/json'},authHeaders()),
          body:JSON.stringify({model,messages:history})});
        if(!r.ok||!r.body) throw new Error('HTTP '+r.status+(r.status===401?' (auth token)':''));
        const reader=r.body.getReader(), dec=new TextDecoder(); let buf='',acc='';
        for(;;){ const {value,done}=await reader.read(); if(done) break;
          buf+=dec.decode(value,{stream:true}); let nl;
          while((nl=buf.indexOf('\n'))>=0){ const line=buf.slice(0,nl).trim(); buf=buf.slice(nl+1);
            if(!line) continue; let m; try{ m=JSON.parse(line); }catch(e){ continue; }
            if(m.message&&m.message.content){ acc+=m.message.content; put(acc); }
            if(m.error) acc+='\n⚠ '+m.error;
          }
        }
        if(!acc) acc='(no response)';
        history.push({role:'assistant',content:acc}); put(acc);
      }catch(e){ put('⚠ '+e.message); }
    } else {
      const reply=demoReply(t); history.push({role:'assistant',content:reply}); put(reply);
    }
  }
  btn.addEventListener('click',send);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') send(); });
}
function demoReply(t){
  t=t.toLowerCase();
  if(t.includes('whale')) return "49 whale wallets tracked. 2 showing convergence on the same mint in the last hour.";
  if(t.includes('trade')||t.includes('pnl')) return "Engine status: nominal. I'm holding off on entries until the exit-rule fix lands.";
  if(t.includes('status')||t.includes('how')) return "All cron tiers green. Heartbeat on Gemma, analysis on DeepSeek, builds on Sonnet.";
  return "Noted. (Demo reply — wire CONFIG.chatAPI to route this to the real Clive on "+CONFIG.hostname+".)";
}

    const y=cur.getFullYear(), m=cur.getMonth();
    const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), t=new Date();

    w.querySelectorAll('.cal-nav').forEach(b=>b.onclick=()=>{ cur.setMonth(cur.getMonth()+(+b.dataset.d)); draw(); });

/* ============================================================
   TON MARKETS — live TON price (tonapi.io rates: 24h/7d/30d) + majors
   (CoinGecko). Public APIs, called straight from the browser (work in demo too).

function tonUsd(n){ n=+n; if(n>=1000) return '$'+n.toLocaleString(undefined,{maximumFractionDigits:0}); if(n>=1) return '$'+n.toFixed(2); return '$'+n.toFixed(4); }
function tonPct(v){ const n=+v; const cls=n>=0?'up':'down'; return `<span class="ton-pct ${cls}">${(n>=0?'+':'')+n.toFixed(2)}%</span>`; }
function tonBig(n){ n=+n||0; if(n>=1e9) return '$'+(n/1e9).toFixed(2)+'B'; if(n>=1e6) return '$'+(n/1e6).toFixed(1)+'M'; if(n>=1e3) return '$'+(n/1e3).toFixed(1)+'K'; return '$'+n.toFixed(0); }
function tonSup(n){ n=+n||0; if(n>=1e9) return (n/1e9).toFixed(2)+'B'; if(n>=1e6) return (n/1e6).toFixed(1)+'M'; return n.toLocaleString(undefined,{maximumFractionDigits:0}); }
function drawTonSpark(cv,data,color){ if(!cv||!data||data.length<2) return;
  const cw=cv.clientWidth||(cv.parentElement&&cv.parentElement.clientWidth)||320, ch=cv.clientHeight||56;
  const w=cv.width=cw*2, h=cv.height=ch*2, c=cv.getContext('2d');
  const min=Math.min(...data), max=Math.max(...data), rng=(max-min)||1;
  const X=i=>i/(data.length-1)*w, Y=v=>h-((v-min)/rng)*h*0.82-h*0.09;
  c.clearRect(0,0,w,h); c.lineWidth=2.4; c.lineJoin='round'; c.strokeStyle=color; c.beginPath();
  data.forEach((v,i)=>{ const x=X(i),y=Y(v); i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke();
  const g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,color+'40'); g.addColorStop(1,color+'00');
  c.lineTo(w,h); c.lineTo(0,h); c.closePath(); c.fillStyle=g; c.fill(); }

        const c=byId[id]; if(!c) return; h+=`<div class="ton-row"><span class="ton-rs">${sym}</span><div class="ton-jm"><span class="ton-rn">${nm}</span><span class="ton-jn">#${c.market_cap_rank} · ${tonBig(c.market_cap)}</span></div><div class="ton-jr"><span class="ton-rp">${tonUsd(c.current_price)}</span>${tonPct(c.price_change_percentage_24h_in_currency||0)}</div></div>`; });

/* ============================================================
   TON WALLET — a proper non-custodial wallet. Connect a real wallet via TON
   Connect (Tonkeeper, MyTonWallet, Wallet-in-Telegram…), then receive (QR), send
   (you sign in your own wallet — keys never touch this app), and track balance,
   tokens, NFTs & activity. Add watch-only addresses too. The TON Connect SDK
   (self-hosted) + QR lib lazy-load on first open. Inspired by Phantom/Tonkeeper:
   a fiat balance hero, a row of round actions, and Tokens/NFTs/Activity tabs.
   ============================================================ */
let _tcu=null, _tcuP=null, _qrP=null, _tcUnsub=null;
function tcLoad(){ if(_tcu) return Promise.resolve(_tcu); if(_tcuP) return _tcuP;
  _tcuP=new Promise((res,rej)=>{ const init=()=>{ try{ _tcu=new TON_CONNECT_UI.TonConnectUI({manifestUrl:location.origin+'/tonconnect-manifest.json'}); res(_tcu); }catch(e){ _tcuP=null; rej(e); } };
    if(window.TON_CONNECT_UI) return init();
    const s=document.createElement('script'); s.src='tonconnect-ui.min.js'; s.onload=init; s.onerror=()=>{ _tcuP=null; rej(new Error('Could not load TON Connect')); }; document.head.appendChild(s); });
  return _tcuP; }
function qrLoad(){ if(window.QRCode) return Promise.resolve(); if(_qrP) return _qrP;
  _qrP=new Promise(res=>{ const s=document.createElement('script'); s.src='qrcode.min.js'; s.onload=res; s.onerror=res; document.head.appendChild(s); }); return _qrP; }
const wGet=()=>{ try{ return JSON.parse(localStorage.getItem('mac_wallets')||'[]'); }catch(e){ return []; } };
const wSet=a=>{ try{ localStorage.setItem('mac_wallets',JSON.stringify(a)); }catch(e){} };
async function tonFriendly(raw){ try{ const r=await fetch('https://tonapi.io/v2/address/'+encodeURIComponent(raw)+'/parse').then(x=>x.json());
  return (r.non_bounceable&&r.non_bounceable.b64url)||(r.bounceable&&r.bounceable.b64url)||raw; }catch(e){ return raw; } }
function mountTonWallet(body){
  const w=el('div','app-pad walletapp'); body.appendChild(w);
  const tapi=p=>fetch('https://tonapi.io/v2'+p).then(r=>r.json());
  const short=a=>{ a=String(a||''); return a.length>16?a.slice(0,5)+'…'+a.slice(-5):a; };
  const ago=ts=>{ const s=Math.floor(Date.now()/1000)-ts; if(s<60)return s+'s'; if(s<3600)return Math.floor(s/60)+'m'; if(s<86400)return Math.floor(s/3600)+'h'; return Math.floor(s/86400)+'d'; };
  let tc=null, conn=null, active=null, price=0, tab='tokens', dead=false;
  let jettons=[], nfts=[], events=[];

  function wallets(){ const l=[]; if(conn) l.push({addr:conn.friendly,label:'My Wallet',connected:true}); wGet().forEach(x=>l.push({addr:x.addr,label:x.label||'Watch',connected:false})); return l; }
  async function loadPrice(){ try{ const r=await tapi('/rates?tokens=ton&currencies=usd'); price=(r.rates&&r.rates.TON&&r.rates.TON.prices&&r.rates.TON.prices.USD)||0; }catch(e){} }

  // ---------- sheets (slide-up modal within the app) ----------
  function openSheet(title){ const ov=el('div','wl-sheet'); ov.innerHTML=`<div class="wl-sheet-card"><div class="wl-sheet-h"><b>${esc(title)}</b><button class="wl-sheet-x">✕</button></div><div class="wl-sheet-b"></div></div>`;
    w.appendChild(ov); requestAnimationFrame(()=>ov.classList.add('show'));
    ov.querySelector('.wl-sheet-x').onclick=()=>closeSheet(ov); ov.addEventListener('click',e=>{ if(e.target===ov) closeSheet(ov); });
    return { ov, body:ov.querySelector('.wl-sheet-b') }; }
  function closeSheet(s){ const ov=s.ov||s; ov.classList.remove('show'); setTimeout(()=>ov.remove(),240); }

  // ---------- connect / watch / disconnect ----------
  async function connect(){ try{ tc=tc||await tcLoad(); await tc.openModal(); }catch(e){ try{ await tc.connectWallet(); }catch(_){ toast('TON Connect unavailable'); } } }
  function addWatch(){ const s=openSheet('Watch an address');
    s.body.innerHTML=`<label class="wl-l">TON address or name.ton</label><input class="wl-in" id="wa-addr" placeholder="UQ… / EQ… / name.ton" spellcheck="false" autocomplete="off">
      <label class="wl-l">Label (optional)</label><input class="wl-in" id="wa-lbl" placeholder="Savings" spellcheck="false">
      <button class="wl-primary" id="wa-go" style="margin-top:14px">Add wallet</button>`;
    s.body.querySelector('#wa-go').onclick=async()=>{ let a=s.body.querySelector('#wa-addr').value.trim(); const lbl=s.body.querySelector('#wa-lbl').value.trim();
      if(!a){ toast('Enter an address'); return; }
      if(/\.ton$/i.test(a)){ try{ const d=await tapi('/dns/'+encodeURIComponent(a)); a=(d.item&&d.item.owner&&d.item.owner.address)||(d.item&&d.item.address)||a; }catch(e){} }
      try{ const acc=await tapi('/accounts/'+encodeURIComponent(a)); if(acc.error) throw 0; a=acc.address?(await tonFriendly(acc.address)):a; }catch(e){ toast('Address not found'); return; }
      const list=wGet(); if(!list.find(x=>x.addr===a)) list.push({addr:a,label:lbl}); wSet(list);
      closeSheet(s); active={addr:a,label:lbl||'Watch',connected:false}; render(); loadData(); toast('Wallet added'); };
  }
  function switcher(){ const s=openSheet('Wallets'); const ws=wallets();
    s.body.innerHTML=`<div class="wl-wlist">${ws.map((x,i)=>`<button class="wl-wrow" data-i="${i}"><span class="wl-dot ${x.connected?'on':''}"></span><div class="wl-wm"><b>${esc(x.label)}</b><span>${short(x.addr)}</span></div>${x.addr===active.addr?'<span class="wl-check">✓</span>':''}${!x.connected?`<span class="wl-rm" data-rm="${esc(x.addr)}">✕</span>`:''}</button>`).join('')}</div>
      <button class="wl-ghost" id="wl-addwatch" style="margin-top:10px">＋ Watch an address</button>
      ${conn?'<button class="wl-ghost danger" id="wl-disc" style="margin-top:8px">Disconnect wallet</button>':'<button class="wl-primary" id="wl-conn2" style="margin-top:8px">Connect Wallet</button>'}`;
    s.body.querySelectorAll('.wl-wrow').forEach(r=>r.onclick=e=>{ if(e.target.closest('.wl-rm')) return; active=ws[+r.dataset.i]; closeSheet(s); render(); loadData(); });
    s.body.querySelectorAll('.wl-rm').forEach(x=>x.onclick=e=>{ e.stopPropagation(); const a=x.dataset.rm; wSet(wGet().filter(y=>y.addr!==a)); closeSheet(s); render(); loadData(); });
    const aw=s.body.querySelector('#wl-addwatch'); if(aw) aw.onclick=()=>{ closeSheet(s); addWatch(); };
    const dc=s.body.querySelector('#wl-disc'); if(dc) dc.onclick=async()=>{ try{ await tc.disconnect(); }catch(e){} conn=null; closeSheet(s); render(); };
    const c2=s.body.querySelector('#wl-conn2'); if(c2) c2.onclick=()=>{ closeSheet(s); connect(); };
  }

  // ---------- receive / send ----------
  async function receive(){ await qrLoad(); const s=openSheet('Receive');
    s.body.innerHTML=`<div class="wl-qr" id="wl-qr"></div><div class="wl-recv">${esc(active.addr)}</div>
      <button class="wl-primary" id="wl-cpy" style="margin-top:12px">Copy address</button>
      <div class="hint" style="text-align:center;margin-top:8px">Send only TON & TON tokens to this address.</div>`;
    const q=s.body.querySelector('#wl-qr'); try{ new QRCode(q,{text:active.addr,width:184,height:184,colorDark:'#0a0a0f',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }catch(e){ q.textContent='QR unavailable'; }
    s.body.querySelector('#wl-cpy').onclick=()=>{ try{navigator.clipboard.writeText(active.addr);}catch(e){} toast('Address copied'); };
  }
  async function send(){ const s=openSheet('Send TON');
    s.body.innerHTML=`<label class="wl-l">To</label><input class="wl-in" id="s-to" placeholder="Address or name.ton" spellcheck="false" autocomplete="off">
      <label class="wl-l">Amount</label><div class="wl-amt"><input class="wl-in" id="s-amt" placeholder="0.0" inputmode="decimal"><span class="wl-amt-c">TON</span><button class="wl-max" id="s-max">Max</button></div>
      <div class="wl-fiat-sm" id="s-fiat"></div>
      <button class="wl-primary" id="s-send" style="margin-top:16px">Send</button>
      <div class="hint" style="margin-top:8px;text-align:center">You'll review &amp; sign in your wallet app.</div>`;
    const to=s.body.querySelector('#s-to'), amt=s.body.querySelector('#s-amt');
    let bal=0; try{ const acc=await tapi('/accounts/'+encodeURIComponent(active.addr)); bal=(acc.balance||0)/1e9; }catch(e){}
    const upd=()=>{ const v=parseFloat(amt.value)||0; s.body.querySelector('#s-fiat').textContent=(price&&v)?('≈ $'+(v*price).toFixed(2)):(bal?('Balance '+bal.toFixed(2)+' TON'):''); };
    amt.addEventListener('input',upd); upd();
    s.body.querySelector('#s-max').onclick=()=>{ amt.value=Math.max(0,bal-0.05).toFixed(4); upd(); };
    s.body.querySelector('#s-send').onclick=async()=>{ let dest=to.value.trim(); const v=parseFloat(amt.value);
      if(!dest) return toast('Enter a recipient'); if(!(v>0)) return toast('Enter an amount'); if(v>bal) return toast('More than your balance');
      if(/\.ton$/i.test(dest)){ try{ const d=await tapi('/dns/'+encodeURIComponent(dest)); dest=(d.item&&d.item.owner&&d.item.owner.address)||(d.item&&d.item.address)||dest; }catch(e){} }
      const btn=s.body.querySelector('#s-send'); btn.disabled=true; btn.textContent='Confirm in your wallet…';
      try{ await tc.sendTransaction({ validUntil:Math.floor(Date.now()/1000)+300, messages:[{address:dest, amount:String(Math.round(v*1e9))}] });
        toast('Transaction sent ✓'); closeSheet(s); setTimeout(loadData,3500); }
      catch(e){ btn.disabled=false; btn.textContent='Send'; toast(/reject|denied|cancel|abort/i.test(e&&e.message||'')?'Cancelled':'Send failed'); }
    };
  }

  // ---------- tabs (tokens / nfts / activity) ----------
  function paintTabs(){
    const counts={tokens:jettons.length,nfts:nfts.length,activity:events.length};
    const seg=[['tokens','Tokens'],['nfts','NFTs'],['activity','Activity']].map(([k,l])=>`<button data-t="${k}" class="${k===tab?'on':''}">${l}${counts[k]?` <i>${counts[k]>99?'99+':counts[k]}</i>`:''}</button>`).join('');
    const bar=w.querySelector('#wl-tabbar'); if(bar) bar.innerHTML=seg;
    const bd=w.querySelector('#wl-tabbody'); if(!bd) return;
    if(tab==='tokens'){
      const rows=[`<div class="ton-row"><span class="ton-rs">💎</span><div class="ton-jm"><span class="ton-rn">Toncoin</span><span class="ton-jn">TON</span></div><div class="ton-jr"><span class="ton-rp" id="wl-tonbal">—</span></div></div>`]
        .concat(jettons.map(b=>{ const j=b.jetton||{},dec=j.decimals||9,bal=(+b.balance||0)/Math.pow(10,dec); const usd=b.price&&b.price.prices&&b.price.prices.USD,val=usd?bal*usd:0;
          return `<div class="ton-row"><span class="ton-jic">${j.image?`<img src="${esc(j.image)}" loading="lazy">`:'💠'}</span><div class="ton-jm"><span class="ton-rn">${esc(j.symbol||'?')}${j.verification==='whitelist'?' <span class="ton-vf">✓</span>':''}</span><span class="ton-jn">${esc(j.name||'')}</span></div><div class="ton-jr"><span class="ton-rp">${bal.toLocaleString(undefined,{maximumFractionDigits:3})}</span>${val?`<span class="ton-jv">$${val.toLocaleString(undefined,{maximumFractionDigits:2})}</span>`:''}</div></div>`; }));
      bd.innerHTML='<div class="ton-list">'+rows.join('')+'</div>';
    } else if(tab==='nfts'){
      bd.innerHTML = nfts.length ? '<div class="ton-nfts">'+nfts.map(n=>{ const p=(n.previews||[]).find(x=>x.resolution==='100x100')||(n.previews||[])[0];
        return `<div class="ton-nft"><div class="ton-nft-img">${p?`<img src="${esc(p.url)}" loading="lazy">`:'🖼'}</div><div class="ton-nft-nm">${esc((n.metadata&&n.metadata.name)||short(n.address))}</div><div class="ton-nft-col">${esc((n.collection&&n.collection.name)||'')}</div></div>`; }).join('')+'</div>' : '<div class="hint" style="padding:16px">No NFTs.</div>';
    } else {
      bd.innerHTML = events.length ? '<div class="ton-list">'+events.map(e=>{ const a=(e.actions&&e.actions[0])||{}, type=(a.type||'Event').replace(/([A-Z])/g,' $1').trim(); let amt='',dir='',who='';
        if(a.TonTransfer){ const tt=a.TonTransfer, out=tt.sender&&active.raw&&tt.sender.address===active.raw||tt.sender&&tt.sender.address&&active.addr&&false; const isOut=tt.sender&&(tt.sender.is_scam!==undefined)&&false; const o=tt.sender&&tt.sender.address; dir=(a.simple_preview&&/Sent/i.test(a.simple_preview.name||''))?'out':(tt.recipient?'in':''); amt=(tt.amount/1e9).toFixed(2)+' TON'; who=short(((dir==='out'?tt.recipient:tt.sender)||{}).address); }
        else if(a.JettonTransfer){ const jt=a.JettonTransfer; amt=(jt.jetton&&jt.jetton.symbol)||'jetton'; who=short(((jt.recipient||jt.sender)||{}).address); }
        return `<div class="ton-ev"><span class="ton-ev-ic ${dir}">${dir==='out'?'↑':(dir==='in'?'↓':'•')}</span><div class="ton-ev-m"><span class="ton-ev-t">${esc(type)}</span>${who?`<span class="ton-ev-w">${esc(who)}</span>`:''}</div><div class="ton-ev-r">${amt?`<span class="ton-ev-a ${dir}">${esc(amt)}</span>`:''}<span class="ton-ev-time">${ago(e.timestamp)}</span></div></div>`; }).join('')+'</div>' : '<div class="hint" style="padding:16px">No recent activity.</div>';
    }
    w.querySelectorAll('#wl-tabbar button').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; paintTabs(); });
  }

  // ---------- data ----------
  async function loadData(){ if(!active||dead) return; const addr=active.addr;
    try{ const acc=await tapi('/accounts/'+encodeURIComponent(addr)); const ton=(acc.balance||0)/1e9;
      const f=w.querySelector('#wl-fiat'), t=w.querySelector('#wl-ton'), tb=w.querySelector('#wl-tonbal');
      if(t) t.textContent=ton.toLocaleString(undefined,{maximumFractionDigits:4})+' TON';
      if(f) f.textContent=price?('$'+(ton*price).toLocaleString(undefined,{maximumFractionDigits:2})):'$'+ton.toFixed(2);
      if(tb) tb.textContent=ton.toLocaleString(undefined,{maximumFractionDigits:3});
    }catch(e){}
    tapi('/accounts/'+encodeURIComponent(addr)+'/jettons?currencies=usd').then(r=>{ if(dead)return; jettons=r.balances||[]; paintTabs(); }).catch(()=>{});
    tapi('/accounts/'+encodeURIComponent(addr)+'/nfts?limit=24&indirect_ownership=false').then(r=>{ if(dead)return; nfts=r.nft_items||[]; paintTabs(); }).catch(()=>{});
    tapi('/accounts/'+encodeURIComponent(addr)+'/events?limit=20').then(r=>{ if(dead)return; events=r.events||[]; paintTabs(); }).catch(()=>{});
  }

  // ---------- screens ----------
  function render(){ const ws=wallets(); if(!ws.length){ renderConnect(); return; }
    if(!active||!ws.find(x=>x.addr===active.addr)) active=ws[0];
    jettons=[]; nfts=[]; events=[]; renderDash(); }
  function renderConnect(){
    w.innerHTML=`<div class="wl-connect"><div class="wl-bigic">${ICONS.wallet}</div><div class="wl-ch">TON Wallet</div>
      <div class="wl-cs">Connect a wallet to send, receive and track your TON, tokens &amp; NFTs.<br><b>Non-custodial</b> — your keys never leave your wallet.</div>
      <button class="wl-primary" id="wl-conn">Connect Wallet</button>
      <button class="wl-ghost" id="wl-watch">Watch an address</button></div>`;
    w.querySelector('#wl-conn').onclick=connect; w.querySelector('#wl-watch').onclick=addWatch;
  }
  function renderDash(){
    w.innerHTML=`<div class="wl-top"><button class="wl-acct" id="wl-acct"><span class="wl-dot ${active.connected?'on':''}"></span><b>${esc(active.label)}</b><span class="wl-addr">${short(active.addr)}</span><span class="wl-caret">▾</span></button></div>
      <div class="wl-hero"><div class="wl-fiat" id="wl-fiat">—</div><div class="wl-tonbig" id="wl-ton">— TON</div></div>
      <div class="wl-actions">
        <button class="wl-act" id="wl-receive"><span class="wl-ai">↓</span>Receive</button>
        <button class="wl-act${active.connected?'':' off'}" id="wl-send"><span class="wl-ai">↑</span>Send</button>
        <button class="wl-act off" id="wl-buy"><span class="wl-ai">＋</span>Buy</button>
        <button class="wl-act off" id="wl-swap"><span class="wl-ai">⇄</span>Swap</button></div>
      <div class="ton-tabs" id="wl-tabbar"></div><div id="wl-tabbody"><div class="hint" style="padding:18px;text-align:center">Loading…</div></div>`;
    w.querySelector('#wl-acct').onclick=switcher;
    w.querySelector('#wl-receive').onclick=receive;
    w.querySelector('#wl-send').onclick=()=>active.connected?send():toast('This is a watch-only wallet — connect it to send');
    w.querySelector('#wl-buy').onclick=()=>toast('Buy TON — coming soon');
    w.querySelector('#wl-swap').onclick=()=>toast('Swap — coming soon');
    paintTabs();
  }

  // ---------- boot ----------
  (async()=>{
    await loadPrice();
    try{ tc=await tcLoad(); }catch(e){ /* offline: watch-only still works */ }
    if(tc){
      const apply=async(wallet)=>{ if(dead) return; if(wallet&&tc.account){ const raw=tc.account.address; conn={raw, friendly:await tonFriendly(raw)}; if(!active||active.connected) active=null; } else conn=null; render(); loadData(); };
      if(_tcUnsub){ try{_tcUnsub();}catch(e){} } _tcUnsub=tc.onStatusChange(()=>apply(tc.account));
      if(tc.account){ const raw=tc.account.address; conn={raw, friendly:await tonFriendly(raw)}; }
    }
    render(); loadData();
  })();
  const o=_winOf(body); if(o) o.cleanup=()=>{ dead=true; if(_tcUnsub){ try{_tcUnsub();}catch(e){} _tcUnsub=null; } };
}

async function mountSysInfo(body){
  const w=el('div','app-pad sysapp'); body.appendChild(w);
  w.innerHTML='<div class="sys-load">Reading the Pi…</div>';
  if(!_api){ w.innerHTML='<div class="sys-grid"><div class="sys-card"><div class="sys-k">Mode</div><div class="sys-v">Demo · no backend</div></div><div class="sys-card"><div class="sys-k">Tip</div><div class="sys-v" style="font-size:13px">Wire CONFIG in Settings to read live hardware</div></div></div>'; return; }
  const g=p=>fetch(`${_api}${p}`,{headers:authHeaders()}).then(r=>r.ok?r.json():null).catch(()=>null);
  let built=false;
  const card=(k,v,id)=>`<div class="sys-card"><div class="sys-k">${k}</div><div class="sys-v"${id?` id="${id}"`:''}>${esc(String(v))}</div></div>`;
  function setv(id,val){ const e=w.querySelector('#'+id); if(e) e.textContent=val; return e; }
  function build(info,hw){
    let h=`<div class="sys-health" id="sh"><span class="sh-dot"></span><div class="sh-tx"><div class="sh-t" id="sh-t">Checking…</div><div class="sh-m" id="sh-m"></div></div></div>`;
    h+='<div class="sys-grid">';
    h+=card('Model',(info&&info.model)||'Raspberry Pi')+card('Hostname',(info&&info.hostname)||CONFIG.hostname||'kay2');
    h+=card('CPU temp','—','v-temp')+card('CPU clock','—','v-clock');
    h+=card('Memory','—','v-mem')+card('Load','—','v-load');
    h+=card('Core voltage','—','v-volt')+card('Uptime','—','v-up');
    h+=card('Disk','—','v-disk')+card('Network','—','v-net');
    if(hw&&hw.cores) h+=card('CPU cores',hw.cores);
    if(hw&&hw.vcGpuMem) h+=card('GPU memory',hw.vcGpuMem);
    if(info&&info.osName) h+=card('OS',info.osName);
    if(info&&info.kernel) h+=card('Kernel',info.kernel);
    h+='</div>';
    if(hw&&hw.governor){ h+=`<div class="sys-sec">CPU governor</div><div class="sys-gov" id="sys-gov"></div>`; }
    const usb=hw&&hw.usb; if(usb&&usb.length){ h+=`<div class="sys-sec">USB devices · ${usb.length}</div><div class="sys-usb">${usb.map(u=>`<div class="usb-row">${esc(u)}</div>`).join('')}</div>`; }
    h+=`<div class="sys-sec">Power</div><div class="sys-power"><button class="proj-b" id="pw-reboot">⟲ Restart Pi…</button><button class="proj-b warn" id="pw-off">⏻ Shut Down…</button></div>`;
    w.innerHTML=h;
    if(hw&&hw.governor){ const gov=w.querySelector('#sys-gov'); const opts=(hw.availGovs&&hw.availGovs.length?hw.availGovs:['ondemand','performance','powersave','schedutil']);
      opts.forEach(o=>{ const b=el('button','gov-b'+(o===hw.governor?' on':''),esc(o)); b.onclick=async()=>{ if(b.classList.contains('on')) return;
        try{ const r=await fetch(`${_api}/api/pi/hardware/governor`,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({governor:o})});
          if(r.ok){ gov.querySelectorAll('.gov-b').forEach(x=>x.classList.remove('on')); b.classList.add('on'); toast('Governor → '+o); } else toast('Governor change needs sudo'); }
        catch(e){ toast('Change failed'); } }; gov.appendChild(b); }); }
    w.querySelector('#pw-reboot').onclick=()=>{ if(confirm('Restart the Raspberry Pi now?\nThe desktop will go offline until it boots back up.')){ fetch(`${_api}/api/pi/power`,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({action:'reboot'})}).catch(()=>{}); toast('Reboot initiated…'); } };
    w.querySelector('#pw-off').onclick=()=>{ if(confirm('Shut down the Raspberry Pi now?\nYou will need physical access to power it back on.')){ fetch(`${_api}/api/pi/power`,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({action:'poweroff'})}).catch(()=>{}); toast('Shutdown initiated…'); } };
    built=true;
  }
  async function tick(){
    const [sys,hw,stor,net]=await Promise.all([g('/api/system'),g('/api/pi/hardware'),g('/api/pi/storage'),g('/api/pi/network')]);
    if(!built){ const info=await g('/api/pi/sysinfo'); build(info,hw); }
    if(sys){ const temp=sys.temp||0; const tc=setv('v-temp',temp.toFixed(1)+'°C'); if(tc) tc.classList.toggle('hot',temp>=75);
      setv('v-mem',sys.mem?Math.round(sys.mem.pct)+'%':'—'); setv('v-load',sys.load?sys.load[0].toFixed(2):'—'); setv('v-up',fmtUptime(sys.uptime)); }
    if(hw){ setv('v-clock', hw.cpuFreqMHz?(Math.round(hw.cpuFreqMHz)+(hw.cpuMaxMHz?' / '+Math.round(hw.cpuMaxMHz):'')+' MHz'):'—'); setv('v-volt', hw.vcVolts?hw.vcVolts+' V':'—');
      const t=hw.throttle||{ok:true,flags:[]}; const nowBad=(t.flags||[]).some(f=>!/^Was/.test(f));
      const sh=w.querySelector('#sh'); if(sh){ sh.className='sys-health '+(t.ok?'ok':(nowBad?'bad':'warn'));
        setv('sh-t', t.ok?'Power & thermals healthy':(nowBad?'Attention needed':'Recovered — past warning'));
        setv('sh-m', t.ok?'No undervoltage or throttling':(t.flags||[]).join(' · ')); } }
    const root=stor&&stor.mounts&&stor.mounts.find(m=>m.mount==='/'); if(root) setv('v-disk', root.used+' / '+root.size+' ('+root.pct+')');
    if(net){ const wifi=net.wifi&&net.wifi.connected; setv('v-net', wifi?('Wi-Fi · '+(net.wifi.ssid||'connected')):((net.ifaces&&net.ifaces.some(i=>i.state==='UP'))?'Wired':'Offline')); }
  }
  tick(); const ti=setInterval(tick,5000);
  const o=_winOf(body); if(o) o.cleanup=()=>clearInterval(ti);
}

/* ============================================================
   BROWSER — a REAL remote browser. The Pi runs headless Chrome with CDP on
   :9222; KAY2Tunnel's /api/browser bridge streams JPEG screenshots and forwards
   clicks / typing / keys / navigation. Because the page renders server-side on
   the Pi, it reaches sites that refuse iframing — a true remote session, not an
   embed. When no backend (demo) or Chrome isn't running, it falls back to the
   classic in-page iframe so the app still works everywhere.
   ============================================================ */
function mountBrowser(body){
  if(!_api){ mountIframeBrowser(body); return; }   // demo / no backend → simple embed
  const wrap=el('div','rbx'); body.appendChild(wrap);
  wrap.innerHTML=`<div class="rbx-bar">
      <button class="rbx-b" data-a="back" title="Back">‹</button>
      <button class="rbx-b" data-a="forward" title="Forward">›</button>
      <button class="rbx-b" data-a="refresh" title="Reload">⟳</button>
      <div class="rbx-addr"><span class="rbx-lock" id="rbx-lock" aria-hidden="true"></span><input class="rbx-url" placeholder="Search or enter address" value="https://www.wikipedia.org" spellcheck="false" autocomplete="off" autocapitalize="off"></div>
      <span class="rbx-dot" id="rbx-dot" title="Remote session"></span>
      <button class="rbx-b" data-a="ext" title="Open in this device's browser">↗</button>
    </div>
    <div class="rbx-prog" id="rbx-prog"></div>
    <div class="rbx-marks" id="rbx-marks"></div>
    <div class="rbx-view">
      <img class="rbx-img" id="rbx-img" alt="Remote browser" draggable="false" tabindex="0">
      <div class="rbx-spin show" id="rbx-spin"><i></i></div>
      <div class="rbx-cover" id="rbx-cover">
        <div class="rbx-cover-card">
          <div class="rbx-cover-h">Remote browser is offline</div>
          <p>The Pi's headless Chrome isn't running. Start it and this becomes a real, server-side session — it can even reach sites that block embedding.</p>
          <code>pm2 start macpios-chrome</code>
          <div class="rbx-cover-row"><button class="rbx-retry" id="rbx-retry">Retry connection</button><button class="rbx-fallback" id="rbx-fb">Use in-page browser</button></div>
        </div>
      </div>
    </div>`;
  const img=wrap.querySelector('#rbx-img'), cover=wrap.querySelector('#rbx-cover'),
        urlin=wrap.querySelector('.rbx-url'), dot=wrap.querySelector('#rbx-dot'),
        spin=wrap.querySelector('#rbx-spin'), prog=wrap.querySelector('#rbx-prog'), lock=wrap.querySelector('#rbx-lock');
  let connected=false, shotTimer=null, imgW=0, imgH=0, dead=false, firstFrame=false, progT=null;
  const norm=v=>{ v=(v||'').trim(); if(!v) return ''; if(/^https?:\/\//.test(v)) return v; if(/^[\w-]+(\.[\w-]+)+/.test(v)) return 'https://'+v; return 'https://duckduckgo.com/?q='+encodeURIComponent(v); };
  const api=(path,opts)=>fetch(`${_api}/api/browser${path}`,Object.assign({headers:authHeaders()},opts));
  const post=(path,bodyObj)=>api(path,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify(bodyObj||{})}).catch(()=>{});
  const LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';
  function setLock(url){ const sec=/^https:/i.test(url||''); lock.innerHTML=sec?LOCK:''; lock.classList.toggle('on',sec); }
  function startProg(){ clearTimeout(progT); prog.classList.remove('done'); void prog.offsetWidth; prog.classList.add('run'); }
  function endProg(){ clearTimeout(progT); prog.classList.add('done'); progT=setTimeout(()=>prog.classList.remove('run','done'),420); }
  function setConn(ok){ connected=ok; dot.classList.toggle('on',ok); cover.classList.toggle('show',!ok); if(!ok) spin.classList.remove('show'); }
  function refreshShot(){ if(dead) return;
    // cache-bust each frame; token in query so <img> auth works
    const base=withToken(`${_api}/api/browser/screenshot`);
    const u=base+(base.includes('?')?'&':'?')+'t='+Date.now();
    const probe=new Image();
    probe.onload=()=>{ if(dead) return; imgW=probe.naturalWidth; imgH=probe.naturalHeight; img.src=probe.src;
      if(!firstFrame){ firstFrame=true; spin.classList.remove('show'); } setConn(true); };
    probe.onerror=()=>{ if(dead) return; setConn(false); };
    probe.src=u;
  }
  // after an action the page is changing — grab a few frames quickly, then settle
  function burst(){ [280,650,1200,2100].forEach(ms=>setTimeout(refreshShot,ms)); }
  async function status(){ try{ const r=await api('/status'); const j=await r.json();
    if(j&&j.connected){ setConn(true); if(j.url){ urlin.value=j.url; setLock(j.url); } if(!shotTimer){ refreshShot(); shotTimer=setInterval(refreshShot,1100); } }
    else { setConn(false); } }catch(e){ setConn(false); } }
  // map a viewport point on the scaled <img> to real device pixels
  const mapXY=(clientX,clientY)=>{ const r=img.getBoundingClientRect(); return { x:Math.round((clientX-r.left)*(imgW/r.width)), y:Math.round((clientY-r.top)*(imgH/r.height)) }; };
  // click → focus the view (so keys flow) + forward
  img.addEventListener('click',e=>{ img.focus(); if(!connected||!imgW) return; const {x,y}=mapXY(e.clientX,e.clientY);
    post('/click',{x,y}); setTimeout(refreshShot,260); });
  // wheel → forward scroll (throttled refresh so it stays smooth)
  let scrollPending=false;
  img.addEventListener('wheel',e=>{ if(!connected||!imgW) return; e.preventDefault();
    const {x,y}=mapXY(e.clientX,e.clientY); post('/scroll',{x,y,dx:Math.round(e.deltaX),dy:Math.round(e.deltaY)});
    if(!scrollPending){ scrollPending=true; setTimeout(()=>{ scrollPending=false; refreshShot(); },170); } },{passive:false});
  // keystrokes when the view has focus
  img.addEventListener('keydown',e=>{ if(!connected) return; e.preventDefault();
    if(e.key.length===1 && !e.ctrlKey && !e.metaKey){ post('/type',{text:e.key}); }
    else { const map={Enter:'Return',Backspace:'Backspace',Tab:'Tab',Escape:'Escape',ArrowUp:'ArrowUp',ArrowDown:'ArrowDown',ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',Delete:'Delete',Home:'Home',End:'End'};
      const k=map[e.key]; if(k) post('/key',{key:k}); }
    setTimeout(refreshShot,230); });
  function action(a,payload){ if(!connected) return; startProg();
    if(a==='navigate') post('/navigate',payload); else post('/'+a);
    burst(); setTimeout(endProg,1700); }
  const navTo=u=>{ u=norm(u); if(!u) return; urlin.value=u; setLock(u); urlin.blur(); action('navigate',{url:u}); setTimeout(()=>img.focus(),300); };
  const go=()=>navTo(urlin.value);
  urlin.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); if(e.key==='Escape') img.focus(); });
  urlin.addEventListener('focus',()=>setTimeout(()=>urlin.select(),0));
  wrap.querySelectorAll('.rbx-b').forEach(b=>b.onclick=()=>{ const a=b.dataset.a;
    if(a==='ext'){ const u=norm(urlin.value); if(u) window.open(u,'_blank','noopener'); return; }
    action(a); });
  // speed-dial bookmarks — jump the remote session to your own projects
  const RBX_MARKS=[['StanCLI','https://stan.spikeradar.co.uk'],['kay2OS','https://kay2os.spikeradar.co.uk'],['Trenches','https://trenchesai.spikeradar.co.uk'],['Clip','https://clip.spikeradar.co.uk'],['GitHub','https://github.com/kay2stack'],['Wikipedia','https://www.wikipedia.org']];
  const marks=wrap.querySelector('#rbx-marks');
  RBX_MARKS.forEach(([nm,u])=>{ const c=el('button','rbx-mark',esc(nm)); c.title=u; c.onclick=()=>navTo(u); marks.appendChild(c); });
  // keyboard shortcuts inside the browser window: ⌘/Ctrl L = address bar, ⌘/Ctrl R = reload
  wrap.addEventListener('keydown',e=>{ if(!(e.metaKey||e.ctrlKey)) return;
    if(e.key==='l'||e.key==='L'){ e.preventDefault(); urlin.focus(); urlin.select(); }
    else if(e.key==='r'||e.key==='R'){ e.preventDefault(); action('refresh'); } });
  wrap.querySelector('#rbx-retry').onclick=()=>{ firstFrame=false; spin.classList.add('show'); status(); };
  wrap.querySelector('#rbx-fb').onclick=()=>{ dead=true; clearInterval(shotTimer); wrap.remove(); mountIframeBrowser(body); };
  status(); const st=setInterval(()=>{ if(!connected) status(); },4000);
  const o=_winOf(body); if(o) o.cleanup=()=>{ dead=true; clearInterval(shotTimer); clearInterval(st); };
}
/* Classic embedded browser — fallback when there's no remote session. */
function mountIframeBrowser(body){
  const wrap=el('div','site'); body.appendChild(wrap);
  const bar=el('div','site-bar');
  bar.innerHTML='<button class="sb-rl" title="Back">‹</button><input class="sb-in" placeholder="Search or enter address" value="https://www.wikipedia.org"><button class="sb-go">Go</button><button class="sb-ext" title="Open in new tab">↗</button>';
  const frame=el('iframe','site-frame'); frame.setAttribute('referrerpolicy','no-referrer');
  const fb=el('div','site-fallback','<div>This site refuses to be embedded.</div><button>Open in a new tab</button>');
  wrap.appendChild(bar); wrap.appendChild(frame); wrap.appendChild(fb);
  const inp=bar.querySelector('.sb-in');
  const norm=v=>{ v=(v||'').trim(); if(!v) return ''; if(/^https?:\/\//.test(v)) return v; if(/^[\w-]+(\.[\w-]+)+/.test(v)) return 'https://'+v; return 'https://duckduckgo.com/?q='+encodeURIComponent(v); };
  const go=()=>{ const u=norm(inp.value); if(!u) return; inp.value=u; fb.classList.remove('show'); frame.classList.remove('hide'); frame.src=u;
    let ld=false; frame.onload=()=>ld=true; setTimeout(()=>{ if(!ld){ frame.classList.add('hide'); fb.classList.add('show'); } },6000); };
  bar.querySelector('.sb-go').onclick=go; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  bar.querySelector('.sb-ext').onclick=()=>{ const u=norm(inp.value); if(u) window.open(u,'_blank','noopener'); };
  fb.querySelector('button').onclick=()=>{ const u=norm(inp.value); if(u) window.open(u,'_blank','noopener'); };
  bar.querySelector('.sb-rl').onclick=()=>{ try{frame.contentWindow.history.back();}catch(e){} };
  go();
}

/* ============================================================
   PROJECTS — your pm2 fleet (StanCLI crossover). Lists every pm2 process
   (capo, trailos, phoebebot, trenches, clip, clive…) with live status + CPU/RAM
   and restart/stop/start via POST /api/pi/pm2. Demo data when no backend.
   ============================================================ */
const PROJ_CRITICAL = ['stan-cli','stan-cli-tunnel','spikeradar-tunnel','kay2os-sync']; // stopping these can kill the API/site
const PROJ_DEMO = [
  {name:'capo-bot',status:'online',cpu:0,memMB:58,restarts:0},
  {name:'trailos',status:'online',cpu:0,memMB:55,restarts:0},
  {name:'phoebebot',status:'online',cpu:1,memMB:58,restarts:0},
  {name:'crypto-daily-channel',status:'online',cpu:0,memMB:103,restarts:2},
  {name:'clip',status:'online',cpu:0,memMB:62,restarts:0},
  {name:'clive-gateway',status:'online',cpu:12,memMB:484,restarts:0},
  {name:'stan-cli',status:'online',cpu:0,memMB:93,restarts:0},
  {name:'trenches-ai',status:'stopped',cpu:0,memMB:0,restarts:0},
];
function mountProjects(body){
  const w=el('div','app-pad projapp'); body.appendChild(w);
  w.innerHTML=`<div class="mgr-top"><div class="mgr-h"><b>Projects</b><span class="proj-sub" id="proj-sub"></span></div>

  const sub=w.querySelector('#proj-sub'), L=w.querySelector('#proj-list'), filter=w.querySelector('#proj-filter');
  const projDot=s=> s==='online'?'live':(s==='errored'?'err':'');
  let data=[];
  async function act(name,action){
    if(action==='stop' && PROJ_CRITICAL.includes(name) && !confirm(`Stop “${name}”?\nThis can take the kay2OS backend / site offline.`)) return;
    if(!_api){ const p=data.find(x=>x.name===name); if(p) p.status=(action==='stop'?'stopped':'online'); render(); return; }
    try{ await fetch(`${_api}/api/pi/pm2`,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify({action,name})}); }catch(e){}
    toast(`${action} ${name}`); setTimeout(load,700);
  }
  function render(){
    const list=data.slice().sort((a,b)=>((a.status==='online'?0:1)-(b.status==='online'?0:1))||String(a.name).localeCompare(b.name));
    const on=list.filter(p=>p.status==='online').length;
    sub.textContent=` ${on}/${list.length} online · pm2 fleet${_api?'':' · demo'}`;
    const q=(filter.value||'').trim().toLowerCase();

    L.innerHTML='';

    shown.forEach(p=>{
      const mb = p.memMB!=null ? p.memMB : Math.round((p.mem||0)/1048576);
      const meta = p.status==='online' ? `${p.cpu||0}% · ${mb}MB${p.restarts?` · ↺${p.restarts}`:''}` : esc(p.status);
      const crit = PROJ_CRITICAL.includes(p.name) ? '<span class="proj-crit" title="Critical — protects the API/site">●</span>' : '';
      const r=el('div','proj-row',`<span class="proj-d ${projDot(p.status)}"></span><span class="proj-nm">${esc(p.name)}${crit}</span><span class="proj-meta">${meta}</span><span class="proj-act"></span>`);
      const a=r.querySelector('.proj-act');
      const mk=(label,action,cls)=>{ const b=el('button','proj-b'+(cls?' '+cls:''),label); b.onclick=()=>act(p.name,action); return b; };
      if(p.status==='online'){ a.appendChild(mk('Restart','restart')); a.appendChild(mk('Stop','stop','warn')); }
      else { a.appendChild(mk('Start','start','go')); }
      L.appendChild(r);
    });
  }
  filter.addEventListener('input',render);
  async function load(){
    if(!_api){ data=PROJ_DEMO; render(); return; }
    try{ const r=await fetch(`${_api}/api/pi/processes`,{headers:authHeaders()}); if(!r.ok) throw 0;
      const j=await r.json(); data=Array.isArray(j)?j:(j.processes||[]); render(); }
    catch(e){ data=PROJ_DEMO; render(); }
  }
  load(); const ti=setInterval(load,5000);
  const o=_winOf(body); if(o) o.cleanup=()=>clearInterval(ti);
}

/* ============================================================
   SCHEDULED JOBS (cron) — GET /api/pi/cron → {user:[{schedule,cmd}],
   system:[{schedule,cmd,file}]}. Read-only viewer with human-readable schedules.
   ============================================================ */
const CRON_DEMO={user:[
  {schedule:'*/5 8-17 * * 1-5',cmd:'income-runner.sh polymarket_scan >> /tmp/cron.log'},
  {schedule:'2 9 * * 1-5',cmd:'income-runner.sh sniper'},
  {schedule:'0 */6 * * *',cmd:'backup.sh ~/projects'},
],system:[
  {schedule:'17 * * * *',cmd:'cd / && run-parts /etc/cron.hourly',file:'crontab'},
  {schedule:'25 6 * * *',cmd:'test -x /usr/sbin/anacron || run-parts /etc/cron.daily',file:'crontab'},
]};
const CRON_DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function cronHuman(expr){
  const p=String(expr||'').trim().split(/\s+/); if(p.length<5) return '';
  const [mi,ho,dom,mon,dow]=p; const pad=n=>String(n).padStart(2,'0'); let t='';
  if(mi==='*'&&ho==='*') t='Every minute';
  else if(/^\*\/(\d+)$/.test(mi)) t='Every '+mi.slice(2)+' min'+(/^\d/.test(ho)?' · '+ho+'h':'');
  else if(/^\d+$/.test(mi)&&/^\d+$/.test(ho)) t='At '+pad(ho)+':'+pad(mi);
  else if(/^\d+$/.test(mi)&&ho==='*') t='Hourly at :'+pad(mi);
  else if(/^\d+$/.test(mi)&&/[-,*\/]/.test(ho)) t=':'+pad(mi)+' past hours '+ho;
  if(dow!=='*'){ const d=/^(\d)-(\d)$/.test(dow)?dow.replace(/^(\d)-(\d)$/,(m,a,b)=>CRON_DOW[a%7]+'–'+CRON_DOW[b%7]):dow.split(',').map(x=>/^\d$/.test(x)?CRON_DOW[x%7]:x).join(','); t=(t?t+' · ':'')+d; }
  else if(dom!=='*'&&mon==='*') t=(t?t+' · ':'')+'day '+dom;
  else if(mon!=='*') t=(t?t+' · ':'')+'mon '+mon;
  return t;
}
function shortCmd(cmd){ let c=String(cmd||'').replace(/\s*>>?\s*\S+(\s+2>&1)?\s*$/,''); // strip trailing redirect
  return c.length>72?c.slice(0,72)+'…':c; }
function mountCron(body){

  let data={user:[],system:[]};

         <div class="cron-meta"><span class="cron-when">${esc(when||'—')}${j.file?` · <span class="cron-file">${esc(j.file)}</span>`:''}</span><span class="cron-cmd" title="${esc(j.cmd||'')}">${esc(cmd)}</span></div>`);
      L.appendChild(r);

  if(!clips.length){ _clipEl.appendChild(el('div','agsw-row',`<span class="nm" style="opacity:.5">No clips yet</span>`)); return; }
  clips.slice(0,12).forEach(c=>{

function copyClip(t){ try{ navigator.clipboard&&navigator.clipboard.writeText(t); }catch(e){} closeClip(); toast('Copied to clipboard'); }
async function injectClip(t){ closeClip();

/* ============================================================
   CONTEXT MENUS — right-click on desktop, long-press on touch (iPad). Reuses the
   .menu-pop styling. ctxMenu(items,{x,y}|{above:rect}); items = [label,fn,opts]
   or null for a separator.
   ============================================================ */
let _ctxPop=null;
function closeCtx(){ if(_ctxPop){ _ctxPop.remove(); _ctxPop=null; } }
function ctxMenu(items, opts){
  closeMenus(); closeCtx(); opts=opts||{};
  const pop=el('div','menu-pop ctx-pop show');
  items.forEach(row=>{ if(row===null){ pop.appendChild(el('div','menu-sep')); return; }
    const [label,fn,o]=row, dis=o&&o.disabled;
    const r=el('div','menu-row'+(dis?' disabled':'')+(o&&o.danger?' danger':''), `<span>${esc(label)}</span>`);
    if(fn&&!dis) r.addEventListener('click',()=>{ closeCtx(); fn(); });
    pop.appendChild(r); });
  document.body.appendChild(pop);
  const w=pop.offsetWidth, h=pop.offsetHeight; let x=opts.x||0, y=opts.y||0;
  if(opts.above){ const r=opts.above; x=r.left+r.width/2-w/2; y=r.top-h-8; }
  pop.style.left=Math.max(6,Math.min(x,innerWidth-w-6))+'px';
  pop.style.top=Math.max(6,Math.min(y,innerHeight-h-6))+'px';
  _ctxPop=pop;
}
document.addEventListener('click',e=>{ if(_ctxPop && !e.target.closest('.ctx-pop')) closeCtx(); });
document.addEventListener('pointerdown',e=>{ if(_ctxPop && !e.target.closest('.ctx-pop')) closeCtx(); },true);
/* long-press (touch) → handler; movement or early release cancels; suppresses the trailing click. */
function onLongPress(elm, handler){
  let timer=null, sx=0, sy=0, fired=false;
  elm.addEventListener('pointerdown',e=>{ if(e.pointerType==='mouse') return; sx=e.clientX; sy=e.clientY; fired=false;
    clearTimeout(timer); timer=setTimeout(()=>{ fired=true; try{navigator.vibrate&&navigator.vibrate(8);}catch(_){} handler(e,elm); }, 480); });
  const cancel=()=>clearTimeout(timer);
  elm.addEventListener('pointermove',e=>{ if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10) cancel(); });
  elm.addEventListener('pointerup',cancel); elm.addEventListener('pointercancel',cancel); elm.addEventListener('pointerleave',cancel);
  elm.addEventListener('click',e=>{ if(fired){ e.stopPropagation(); e.preventDefault(); fired=false; } },true);
}

}

/* ============================================================
   APP SWITCHER — ⌘/Ctrl-Tab overlay. Hold the modifier and press Tab to cycle
   open windows; release to focus, Esc to cancel, or click a tile.
   ============================================================ */
let _sw=null;
function swStep(shift){
  const ids=Object.keys(openWindows); if(!ids.length) return;
  if(!_sw){
    const ov=el('div'); ov.id='appswitch'; const inner=el('div','as-inner'); ov.appendChild(inner);
    ids.forEach((id,i)=>{ const a=APPS[id]; const it=el('div','as-item');
      it.innerHTML=`<div class="as-ic" style="background:${a.grad}">${a.icon}</div><div class="as-nm">${esc(a.name)}</div>`;
      it.addEventListener('click',()=>swCommit(id)); inner.appendChild(it); });
    ov.addEventListener('click',e=>{ if(e.target===ov) swCommit('__cancel__'); });   // tap background to dismiss (touch)
    document.body.appendChild(ov); requestAnimationFrame(()=>ov.classList.add('show'));
    _sw={ov, ids, idx:ids.length>1?(shift?ids.length-1:1):0};
  } else { _sw.idx=(_sw.idx+(shift?-1:1)+_sw.ids.length)%_sw.ids.length; }
  [..._sw.ov.querySelectorAll('.as-item')].forEach((it,i)=>it.classList.toggle('sel',i===_sw.idx));
}
function swCommit(forceId){ if(!_sw) return; const id = forceId==='__cancel__'?null:(forceId||_sw.ids[_sw.idx]);
  const ov=_sw.ov; ov.classList.remove('show'); setTimeout(()=>ov.remove(),160); _sw=null;
  if(id && openWindows[id]){ if(openWindows[id].minimized) restoreWindow(id); else focusWindow(id); } }
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='Tab'){ e.preventDefault(); swStep(e.shiftKey); }
  else if(e.key==='Escape'&&_sw){ e.preventDefault(); swCommit('__cancel__'); }
});
addEventListener('keyup',e=>{ if(_sw && (e.key==='Meta'||e.key==='Control')) swCommit(); });

/* TOUCH app-switching — on iPhone/iPad there's no ⌘-Tab, so Mission Control is
   the switcher. Reach it from the always-visible menu-bar button, or a swipe up
   from the bottom of the desktop. Mission Control lives in kay2os-extras.js;
   it's triggered via its dock item so we don't depend on its internal scope. */
function triggerMC(){ const d=document.querySelector('.dock-item[data-x="mc"]'); if(d){ d.click(); return true; }
  if(window.k2xNotify) k2xNotify('Mission Control','Loading…'); return false; }
(function(){ const mc=$('#mb-mc'); if(mc) mc.addEventListener('click',e=>{ e.stopPropagation(); triggerMC(); }); })();
// swipe up from the bottom of the desktop → Mission Control (single finger, on the wallpaper)

/* ============================================================
   SPACES — virtual desktops. Windows are tagged with .space; switching
   shows/hides accordingly. Strip via ⌃↑ (or the Window menu); ⌃1..9 jump.
   ============================================================ */
let spaceList=[1,2,3], curSpace=1, nextSpaceId=4;
const spacesEl=$('#spaces');
function windowsInSpace(n){ return Object.values(openWindows).filter(o=>(o.space||1)===n); }
function switchSpace(n){ curSpace=n;
  Object.values(openWindows).forEach(o=>{ o.win.style.display=((o.space||1)===n && !o.minimized)?'flex':'none'; });
  if(spacesEl.classList.contains('show')) renderSpaces();
  if(window.k2xNotify) k2xNotify('Desktop '+(spaceList.indexOf(n)+1),'');
}
function renderSpaces(){
  spacesEl.innerHTML='';
  spaceList.forEach((sid,idx)=>{
    const th=el('div','space-th'+(sid===curSpace?' active':''),`<span class="del">✕</span><span class="cnt">${windowsInSpace(sid).length}</span><span class="lbl">Desktop ${idx+1}</span>`);
    th.addEventListener('click',()=>{ switchSpace(sid); hideSpaces(); });
    th.querySelector('.del').addEventListener('click',ev=>{ ev.stopPropagation(); removeSpace(sid); });
    spacesEl.appendChild(th);
  });
  const add=el('div','space-add','+'); add.addEventListener('click',()=>{ spaceList.push(nextSpaceId++); renderSpaces(); }); spacesEl.appendChild(add);
}
function removeSpace(sid){ if(spaceList.length<=1) return;
  const rest=spaceList.filter(s=>s!==sid), target=rest[0];
  Object.values(openWindows).forEach(o=>{ if((o.space||1)===sid) o.space=target; });
  spaceList=rest; if(curSpace===sid) switchSpace(target); else renderSpaces();
}
function showSpaces(){ spacesEl.classList.add('show'); renderSpaces(); }
function hideSpaces(){ spacesEl.classList.remove('show'); }
function toggleSpaces(){ spacesEl.classList.contains('show')?hideSpaces():showSpaces(); }
spacesEl.addEventListener('click',e=>{ if(e.target===spacesEl) hideSpaces(); });
addEventListener('keydown',e=>{
  if(e.ctrlKey&&!e.altKey&&e.key==='ArrowUp'){ e.preventDefault(); toggleSpaces(); }
  else if((e.ctrlKey||e.metaKey)&&!e.altKey&&/^[1-9]$/.test(e.key)){ const idx=+e.key-1; if(spaceList[idx]!=null){ e.preventDefault(); switchSpace(spaceList[idx]); } }
  else if(e.key==='Escape'&&spacesEl.classList.contains('show')){ hideSpaces(); }
});

/* ============================================================
   CLIVE ALERTS → NOTIFICATION CENTER. Clive is the operator brain that already
   reports to Telegram; this surfaces those same alerts as MacPiOs notification
   banners. Polls GET /api/clive/alerts → [{id,title,body,ts}] (or {alerts:[…]}),
   de-duplicates by id so each alert banners exactly once, and routes through the
   shared k2xNotify → Notification Center pipeline. Silent + harmless when the
   endpoint is absent; seeds one demo alert in demo mode so the wiring is visible.
   ============================================================ */
const _cliveSeen = new Set();
let _cliveDemoed = false;
function _cliveNote(a){
  const id = String(a.id || a.ts || a.title || Math.random());
  if(_cliveSeen.has(id)) return; _cliveSeen.add(id);
  if(_cliveSeen.size>200){ _cliveSeen.clear(); _cliveSeen.add(id); }
  const title = a.title || a.subject || 'Clive';
  const bodyt = a.body || a.message || a.text || '';
  if(window.k2xNotify) k2xNotify('🛰 '+title, bodyt);
}
async function pollCliveAlerts(){
  if(!_api){
    if(!_cliveDemoed){ _cliveDemoed=true; setTimeout(()=>_cliveNote({id:'demo-1',title:'Clive · whale convergence',body:'3 wallets accumulating the same token — worth a look'}),2600); }
    return;
  }
  try{
    const r=await fetch(`${_api}/api/clive/alerts`,{headers:authHeaders()});
    if(!r.ok) return;                       // endpoint not wired yet → stay quiet
    // SPA catch-all returns index.html (200) for unknown routes; only parse real JSON
    if(!/application\/json/i.test(r.headers.get('content-type')||'')) return;
    const j=await r.json();
    const list=Array.isArray(j)?j:(j.alerts||j.items||j.notifications||[]);
    // newest last so banners arrive in chronological order
    list.slice().reverse().forEach(_cliveNote);
  }catch(e){ /* offline — pollStats already surfaces connection loss */ }
}

/* ---------- Agent Switcher / live tmux session indicators ----------
   Polls KAY2Tunnel's read-only GET /api/tmux for live session names, lights up a
   green dot on each agent's dock tile + the switcher row, and lets you jump to any
   agent (click a row, the menubar Agents item, or ⌃⌥1..N). Opening a tile attaches
   to (or creates) the tmux session, so it survives window close. */
let _agLive = new Set();
async function pollAgents(){
  if(!_api){ return; }
  try{
    const r=await fetch(`${_api}/api/tmux`,{headers:authHeaders()});
    if(!r.ok) return;
    const j=await r.json(); _agLive=new Set((j.sessions||[]));
  }catch(e){ return; }
  // dock dots: an agent tile is "live" if its tmux session exists
  AGENT_IDS.forEach(id=>{ const a=APPS[id], di=dockItem(id);
    if(di) di.classList.toggle('agent-live', !a.missing && _agLive.has(AGENTS[a.agentKey].session)); });
  // open agent windows: keep the header pill in sync with the live tmux state
  document.querySelectorAll('.agent-bar').forEach(bar=>setAgentBar(bar, _agLive.has(bar.dataset.session)));
  if(_agswEl) renderSwitcher(); // refresh open popover
}
let _agswEl=null;
function closeSwitcher(){ if(_agswEl){ _agswEl.remove(); _agswEl=null; } }
function renderSwitcher(){
  if(!_agswEl) return;
  _agswEl.innerHTML='<div class="agsw-h">Agents</div>';
  AGENT_IDS.forEach((id,i)=>{
    const a=APPS[id], live=!a.missing && _agLive.has(AGENTS[a.agentKey].session);
    const sc = (i<AGENT_LIVE_IDS.length && !a.missing) ? `⌃⌥${AGENT_LIVE_IDS.indexOf(id)+1}` : '';
    const row=el('div','agsw-row'+(a.missing?' missing':''),
      `<span class="ic" style="background:${a.grad}">${a.icon}</span><span class="nm">${a.name}</span>${sc?`<span class="sc">${sc}</span>`:''}<span class="agsw-dot${live?' live':''}"></span>`);
    if(!a.missing) row.addEventListener('click',()=>{ closeSwitcher(); launchApp(id); });
    _agswEl.appendChild(row);
  });
}
function openSwitcher(anchor){
  closeSwitcher(); _agswEl=el('div','agsw'); document.body.appendChild(_agswEl); renderSwitcher();
  const ar=anchor.getBoundingClientRect(), w=_agswEl.offsetWidth;
  _agswEl.style.top=(ar.bottom+4)+'px'; _agswEl.style.left=Math.max(6, Math.min(ar.right-w, innerWidth-w-6))+'px';

async function validateToken(t){

/* ---- Passkey (WebAuthn) login -------------------------------------------
   A real public/private key pair: the private key stays on the device and
   syncs across the user's Apple devices via iCloud Keychain; we only ever send
   the server an assertion it verifies against the stored PUBLIC key. On success
   the server returns the same AUTH_TOKEN the password grants, cached identically
   as stan_token. Enrollment requires being logged in first (the trust anchor). */
const _b64uToBuf = s => { s=String(s).replace(/-/g,'+').replace(/_/g,'/'); const pad=s.length%4?4-(s.length%4):0; s+='='.repeat(pad);
  const bin=atob(s), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; };
const _bufToB64u = b => { const u=new Uint8Array(b); let s=''; for(let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const passkeySupported = ()=> !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
async function passkeyEnrolled(){
  if(!_api||!passkeySupported()) return false;
  try{ const r=await fetch(`${_api}/api/webauthn/status`); return r.ok && (await r.json()).enrolled===true; }catch(e){ return false; }
}
async function passkeyLogin(){
  const r=await fetch(`${_api}/api/webauthn/auth/options`); if(!r.ok) throw new Error('no passkeys');
  const o=await r.json(); o.challenge=_b64uToBuf(o.challenge);
  if(o.allowCredentials) o.allowCredentials=o.allowCredentials.map(c=>({...c,id:_b64uToBuf(c.id)}));
  const c=await navigator.credentials.get({publicKey:o}), rsp=c.response;
  const body={ id:c.id, rawId:_bufToB64u(c.rawId), type:c.type,
    response:{ authenticatorData:_bufToB64u(rsp.authenticatorData), clientDataJSON:_bufToB64u(rsp.clientDataJSON),
      signature:_bufToB64u(rsp.signature), userHandle:rsp.userHandle?_bufToB64u(rsp.userHandle):undefined },
    clientExtensionResults:c.getClientExtensionResults?c.getClientExtensionResults():{},
    authenticatorAttachment:c.authenticatorAttachment||undefined };
  const v=await fetch(`${_api}/api/webauthn/auth/verify`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await v.json(); if(!v.ok||!j.verified||!j.token) throw new Error(j.error||'verify failed');
  return j.token;
}
async function passkeyEnroll(label){
  const r=await fetch(`${_api}/api/webauthn/register/options`,{headers:authHeaders()});
  if(!r.ok) throw new Error('options failed ('+r.status+')');
  const o=await r.json(); o.challenge=_b64uToBuf(o.challenge); o.user.id=_b64uToBuf(o.user.id);
  if(o.excludeCredentials) o.excludeCredentials=o.excludeCredentials.map(c=>({...c,id:_b64uToBuf(c.id)}));
  const c=await navigator.credentials.create({publicKey:o}), rsp=c.response;
  const body={ id:c.id, rawId:_bufToB64u(c.rawId), type:c.type, label:label||'iOS device',
    response:{ attestationObject:_bufToB64u(rsp.attestationObject), clientDataJSON:_bufToB64u(rsp.clientDataJSON),
      transports:(rsp.getTransports?rsp.getTransports():[]) },
    clientExtensionResults:c.getClientExtensionResults?c.getClientExtensionResults():{},
    authenticatorAttachment:c.authenticatorAttachment||undefined };
  const v=await fetch(`${_api}/api/webauthn/register/verify`,{method:'POST',
    headers:Object.assign({'Content-Type':'application/json'},authHeaders()),body:JSON.stringify(body)});
  const j=await v.json(); if(!v.ok||!j.verified) throw new Error(j.error||'verify failed');
  return j.count;
}

function showLock(){ const l=$('#lock'); l.classList.add('show'); setTimeout(()=>$('#lk-input').focus(),120);
  const pk=$('#lk-passkey'); if(pk){ pk.style.display='none'; passkeyEnrolled().then(en=>{ if(en) pk.style.display=''; }); } }
function hideLock(){ const l=$('#lock'); l.classList.remove('show'); setTimeout(()=>l.style.display='none',500); }
async function tryUnlock(){
  const inp=$('#lk-input'), err=$('#lk-err'), pill=$('#lk-pill'), go=$('#lk-go');
  // Strip ALL whitespace, not just the ends: pasting a token that wrapped onto
  // two lines otherwise smuggles a newline/space into the middle and fails.
  const t=inp.value.replace(/\s+/g,''); if(!t) return;
  err.style.opacity='0'; inp.disabled=true; go.disabled=true;
  let ok=false, reason='auth';
  try{ const r=await fetch(`${_api}/api/term/sessions`,{headers:{'Authorization':'Bearer '+t}});
    ok=r.ok; if(!ok) reason=(r.status===401?'auth':'http'+r.status);
  }catch(e){ reason='network'; }
  inp.disabled=false; go.disabled=false;
  if(ok){ _tokCache=t; try{localStorage.setItem('stan_token',t);}catch(e){} hideLock(); enterDesktop(); }
  else { err.textContent = reason==='network' ? 'Can’t reach server — check connection'
                         : reason.startsWith('http') ? ('Server error ('+reason+')')
                         : 'Incorrect password';
    err.style.opacity='1'; pill.classList.remove('shake'); void pill.offsetWidth; pill.classList.add('shake'); inp.value=''; inp.focus(); }
}
async function tryPasskey(){
  const err=$('#lk-err'), btn=$('#lk-passkey'); err.style.opacity='0'; btn.disabled=true;
  try{ const t=await passkeyLogin(); _tokCache=t; try{localStorage.setItem('stan_token',t);}catch(e){}
    hideLock(); enterDesktop();
  }catch(e){ btn.disabled=false;
    if(e.name!=='NotAllowedError' && e.name!=='AbortError'){ err.textContent='Passkey sign-in failed'; err.style.opacity='1'; } }
}

function ringSVG(pct,color,size,sw){ size=size||84; sw=sw||9;
  const r=(size-sw)/2, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,pct||0)));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--field)" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" style="transition:stroke-dashoffset .6s var(--ease)"/></svg>`;
}
function fmtUptime(s){ s=+s||0; const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return (d?d+'d ':'')+h+'h '+m+'m'; }

/* Useful desktop notifications from REAL Pi telemetry (via the extras toast).
   Edge-triggered: each fires once when crossing a threshold, never per-poll. */
const _alert={greeted:false,online:true,hot:false,mem:false,load:false,disk:false,throttle:false};
function pushNote(t,b){ if(window.k2xNotify) window.k2xNotify(t,b); }
function _offline(){ if(_alert.online){ _alert.online=false; pushNote('Lost connection to the Pi','Trying to reconnect…'); } }
async function pollStats(){
  if(!_api) return;   // demo mode: leave skeletons with placeholders
  const set=(id,v)=>{ const e=$('#'+id); if(e)e.textContent=v; };
  try{
    const sys=await fetch(`${_api}/api/system`,{headers:authHeaders()}).then(r=>r.ok?r.json():null);
    if(sys){
      const t=$('#wg-uptime'); if(t)t.textContent=fmtUptime(sys.uptime);
      // control-center Pi panel
      set('cc-pi-temp',(sys.temp||0).toFixed(1)+' °C');
      set('cc-pi-load',sys.load?Math.round(sys.load[0]/(navigator.hardwareConcurrency||4)*100)+'%':'—');
      if(sys.mem) set('cc-pi-mem',gb(sys.mem.used)+' / '+gb(sys.mem.total)+' GB');
      set('cc-pi-up',fmtUptime(sys.uptime));
      const temp=sys.temp||0; const tr=$('#wg-temp-ring'); if(tr)tr.innerHTML=ringSVG(temp/85, temp>70?'#ff9f0a':'#2BE5FF')+`<div class="lbl">${temp.toFixed(0)}°<small>SoC</small></div>`;
      const tv=$('#wg-temp-val'); if(tv)tv.textContent=temp.toFixed(1)+' °C';
      if(sys.mem){ const mr=$('#wg-mem-ring'); if(mr)mr.innerHTML=ringSVG(sys.mem.pct/100,'#2b7fff')+`<div class="lbl">${gb(sys.mem.used)}<small>of ${gb(sys.mem.total)} GB</small></div>`;
        const mu=$('#wg-mem-used'); if(mu)mu.textContent=gb(sys.mem.used)+' GB'; const mt=$('#wg-mem-total'); if(mt)mt.textContent=gb(sys.mem.total)+' GB'; }
      _tempHist.push((sys.cpu!=null?sys.cpu:(sys.load?sys.load[0]*10:0))); if(_tempHist.length>40)_tempHist.shift(); drawSpark();
      // ---- real health alerts (edge-triggered) ----
      if(!_alert.online){ _alert.online=true; pushNote('Reconnected','Back online with '+CONFIG.hostname); }
      if(!_alert.greeted){ _alert.greeted=true; pushNote('MacPiOs ready','Connected to '+CONFIG.hostname+' · systems nominal'); }
      const tp=sys.temp||0;
      if(tp>=75 && !_alert.hot){ _alert.hot=true; pushNote('⚠ High SoC temperature', tp.toFixed(0)+'°C — the Pi may start throttling'); }
      else if(tp<70 && _alert.hot){ _alert.hot=false; pushNote('Temperature normal', 'SoC cooled to '+tp.toFixed(0)+'°C'); }
      if(sys.mem){ const mp=sys.mem.pct||0;
        if(mp>=90 && !_alert.mem){ _alert.mem=true; pushNote('Memory pressure', mp.toFixed(0)+'% of RAM in use'); }
        else if(mp<80 && _alert.mem){ _alert.mem=false; } }
      if(sys.load){ const c=navigator.hardwareConcurrency||4, l1=sys.load[0];
        if(l1>=c*1.5 && !_alert.load){ _alert.load=true; pushNote('High CPU load', 'Load '+l1.toFixed(2)+' across '+c+' cores'); }
        else if(l1<c && _alert.load){ _alert.load=false; } }
    } else { _offline(); }
  }catch(e){ _offline(); }
  try{
    const info=await fetch(`${_api}/api/pi/sysinfo`,{headers:authHeaders()}).then(r=>r.ok?r.json():null);
    if(info){ const o=$('#wg-osname'); if(o)o.textContent=(info.model||'Raspberry Pi'); const a=$('#wg-arch'); if(a)a.textContent=(info.kernel||'').split('+')[0]+' · aarch64'; }
  }catch(e){}
  try{
    const st=await fetch(`${_api}/api/pi/storage`,{headers:authHeaders()}).then(r=>r.ok?r.json():null);
    if(st&&st.mounts){ const root=st.mounts.find(m=>m.mount==='/')||st.mounts[0];
      if(root){ const pct=parseInt(root.pct)||0; const b=$('#wg-stor-bar'); if(b)b.style.width=pct+'%';
        const u=$('#wg-stor-used'); if(u)u.textContent=root.used+'B'; const f=$('#wg-stor-free'); if(f)f.textContent=root.avail+'B';
        const dv=$('#wg-stor-dev'); if(dv)dv.textContent=(root.fs||'disk')+' · '+root.size;
        const cs=$('#cc-pi-stor'); if(cs)cs.textContent=root.used+'B / '+root.size+'B';
        if(pct>=90 && !_alert.disk){ _alert.disk=true; pushNote('Storage almost full', root.mount+' is at '+pct+'%'); }
        else if(pct<85 && _alert.disk){ _alert.disk=false; } } }
  }catch(e){}
  try{
    const net=await fetch(`${_api}/api/pi/network`,{headers:authHeaders()}).then(r=>r.ok?r.json():null);
    if(net&&net.ifaces){ const up=net.ifaces.find(i=>i.state==='UP'&&i.addrs&&i.addrs.some(a=>a.family==='inet'))||net.ifaces.find(i=>i.state==='UP')||net.ifaces[0];
      if(up){ const ifn=$('#wg-net-if'); if(ifn)ifn.textContent=up.name; const v4=(up.addrs||[]).find(a=>a.family==='inet');
        const ip=$('#wg-net-ip'); if(ip)ip.textContent=v4?v4.addr:'—'; const sd=$('#wg-net-dot'); const ss=$('#wg-net-state');
        if(ss)ss.textContent=up.state==='UP'?'Connected':'Down'; if(sd)sd.style.background=up.state==='UP'?'#32d74b':'#ff6961'; } }
  }catch(e){}
  // ---- undervoltage / throttle alert (edge-triggered) — "see undervolting before it bites" ----
  try{
    const hw=await fetch(`${_api}/api/pi/hardware`,{headers:authHeaders()}).then(r=>r.ok?r.json():null);
    if(hw&&hw.throttle){ const active=(hw.throttle.flags||[]).filter(f=>!/^Was/.test(f));
      if(active.length && !_alert.throttle){ _alert.throttle=true; pushNote('⚡ Power warning', active.join(' · ')+' — check the Pi’s power supply'); }
      else if(!active.length && _alert.throttle){ _alert.throttle=false; pushNote('Power recovered','Undervoltage / throttling cleared'); } }
  }catch(e){}
}
function drawSpark(){ const cv=$('#wg-net-spark'); if(!cv)return; const w=cv.width=cv.clientWidth*2,h=cv.height=cv.clientHeight*2,c=cv.getContext('2d');
  c.clearRect(0,0,w,h); const arr=_tempHist; if(arr.length<2)return; const max=Math.max(20,...arr);
  c.lineWidth=2.5; c.strokeStyle='#2BE5FF'; c.beginPath();
  arr.forEach((v,i)=>{ const x=i/(arr.length-1)*w, y=h-(v/max)*h*0.9-2; i?c.lineTo(x,y):c.moveTo(x,y); }); c.stroke();
  const g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,'#2BE5FF55'); g.addColorStop(1,'#2BE5FF00');
  c.lineTo(w,h); c.lineTo(0,h); c.closePath(); c.fillStyle=g; c.fill(); }
